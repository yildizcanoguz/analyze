<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MASTER DQE</title>
  <style>
    body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial; background:#f4f6f8; margin:0; padding:16px; color:#222; }
    .wrap { max-width: 1200px; margin: 0 auto; background:#fff; border:1px solid #e5e7eb; border-radius:16px; padding:16px; box-shadow:0 10px 30px rgba(0,0,0,.05); }
    h1 { margin:0 0 12px; font-size:20px; }

    .toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin: 10px 0 14px; }
    input[type="text"] { padding:10px 12px; border:1px solid #d1d5db; border-radius:10px; min-width:320px; }
    select, .btn { padding:10px 12px; border:1px solid #d1d5db; background:#fff; border-radius:10px; cursor:pointer; }
    .btn:hover, select:hover { background:#f9fafb; }
    .chip { padding:8px 10px; border:1px solid #e5e7eb; border-radius:999px; background:#f9fafb; font-size:12px; color:#374151; }
    label { display:flex; gap:8px; align-items:center; user-select:none; }
    .muted { color:#6b7280; }

    table { width:100%; border-collapse: collapse; font-size: 13px; }
    thead th { position: sticky; top: 0; background:#f9fafb; border-bottom:1px solid #e5e7eb; padding:10px; text-align:left; z-index:2; }
    tbody td, tfoot td { border-bottom:1px solid #eef2f7; padding:10px; vertical-align: top; }
    tbody tr:hover td { background:#fcfcfd; }

    .num { text-align:right; white-space:nowrap; font-variant-numeric: tabular-nums; }
    .art { white-space:nowrap; font-weight:600; }
    mark { padding:0 2px; border-radius:4px; background:#ffe08a; }

    .serie td { background:#fff7d6; font-weight:800; border-bottom:1px solid #f1e3a6; }
    .subsection td { background:#fff2bf; font-weight:700; border-bottom:1px solid #f1e3a6; }
    .subtotal td { background:#f3f4f6; font-weight:700; }

    tfoot td { background:#111827; color:#fff; font-weight:800; border-bottom:none; }

    .toggle { display:flex; align-items:center; gap:10px; }
    .caret {
      width:18px; height:18px; display:inline-flex; align-items:center; justify-content:center;
      border:1px solid #e5e7eb; border-radius:6px; background:#fff; font-size:12px;
    }
    .right { margin-left:auto; display:flex; gap:8px; align-items:center; }
    .badge { font-size:12px; padding:3px 8px; border-radius:999px; border:1px solid #e5e7eb; background:#fff; }

    .panelBox{ display:flex; gap:16px; flex-wrap:wrap; align-items:flex-start; }
    .panelGrid{ display:grid; grid-template-columns: 190px 160px; gap:8px 10px; align-items:center; }
    .panelGrid input, .panelGrid select{
      padding:8px; border:1px solid #d1d5db; border-radius:10px; background:#fff;
    }

    .card {
      border:1px solid #e5e7eb; border-radius:14px; padding:12px;
      background:#fff; min-width: 320px;
    }
    .card h3 { margin:0 0 8px; font-size:13px; }
    .kv { display:grid; grid-template-columns: 1fr 1fr; gap:6px 10px; align-items:center; font-size:12px; }
    .kv div:nth-child(odd) { color:#6b7280; }
    .kv div:nth-child(even) { font-weight:700; text-align:right; }
    .small { font-size:12px; }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>MASTER DQE</h1>

    <div class="toolbar">
      <select id="viewSel">
        <option value="dqe">DQE</option>
        <option value="cost">Makina & İşçilik</option>
      </select>

      <input id="q" type="text" placeholder="Hızlı filtre (ART / açıklama / UM / fiyat)…" />
      <button class="btn" id="clearBtn">Temizle</button>

      <button class="btn" id="expandAll">Tümünü Aç</button>
      <button class="btn" id="collapseAll">Tümünü Kapat</button>

      <label class="chip" title="DQE ekranında: ART’a göre sıralama (her alt başlık içinde)">
        <input type="checkbox" id="sortArt" />
        ART’a göre sırala
      </label>

      <span class="chip" id="count"></span>
      <span class="chip" id="grandChip"></span>
    </div>

    <table>
      <thead>
        <tr>
          <th style="width:140px">ART</th>
          <th>DESCRIPTION</th>
          <th style="width:90px">UM</th>
          <th class="num" style="width:170px">DZD</th>
          <th class="num" style="width:140px">Euro</th>
          <th class="num" style="width:190px">DZDéqv</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
      <tfoot>
        <tr>
          <td colspan="3">GRAND TOTAL</td>
          <td class="num" id="gtDzd"></td>
          <td class="num" id="gtEuro"></td>
          <td class="num" id="gtEqv"></td>
        </tr>
      </tfoot>
    </table>

    <datalist id="dqeArtList"></datalist>

    <p class="muted" style="margin:10px 0 0;">
      Filtre açıkken eşleşen satırlar highlight olur. DQE’de filtre açıkken seriler otomatik açık görünür.
    </p>
  </div>

  <script type="module">
    import { dqe, costSheets } from "./database.js";

    const tbody = document.getElementById("tbody");
    const q = document.getElementById("q");
    const clearBtn = document.getElementById("clearBtn");
    const expandAllBtn = document.getElementById("expandAll");
    const collapseAllBtn = document.getElementById("collapseAll");
    const sortArtEl = document.getElementById("sortArt");
    const countEl = document.getElementById("count");
    const grandChip = document.getElementById("grandChip");
    const viewSel = document.getElementById("viewSel");

    const gtDzd = document.getElementById("gtDzd");
    const gtEuro = document.getElementById("gtEuro");
    const gtEqv = document.getElementById("gtEqv");

    const dqeArtList = document.getElementById("dqeArtList");

    let currentView = "dqe";

    // Tek sheet var şimdilik
    const sheet = costSheets[0];

    // COST ekranında seçilen poz
    const LS_KEY = "selected_poz_art_v1";
    let selectedPozArt = localStorage.getItem(LS_KEY) || ""; // örn: C3.1
    let selectedPozColumn = localStorage.getItem("selected_poz_col_v1") || "dzdEqv"; // dzd | dzdEqv | euro

    // -----------------------
    // Helpers
    // -----------------------
    const fmt = (v) => {
      if (v === null || v === undefined) return "-";
      return new Intl.NumberFormat("tr-TR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(v);
    };

    function esc(s) {
      return (s ?? "").toString()
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function highlight(text, needle) {
      const t = (text ?? "").toString();
      if (!needle) return esc(t);
      const n = needle.toLowerCase();
      const idx = t.toLowerCase().indexOf(n);
      if (idx === -1) return esc(t);
      const before = t.slice(0, idx);
      const mid = t.slice(idx, idx + needle.length);
      const after = t.slice(idx + needle.length);
      return `${esc(before)}<mark>${esc(mid)}</mark>${esc(after)}`;
    }

    // ART natural compare (A2.10 > A2.2)
    function artKey(art) {
      const s = (art || "").trim();
      const m = s.match(/^([A-Za-z]+)\s*(.*)$/);
      const letters = (m?.[1] || "").toUpperCase();
      const rest = (m?.[2] || "").replace(/[^\d.]/g, "");
      const nums = rest ? rest.split(".").filter(Boolean).map(n => parseInt(n, 10)) : [];
      return { letters, nums };
    }
    function cmpArt(a, b) {
      const ka = artKey(a), kb = artKey(b);
      if (ka.letters !== kb.letters) return ka.letters < kb.letters ? -1 : 1;
      const len = Math.max(ka.nums.length, kb.nums.length);
      for (let i = 0; i < len; i++) {
        const na = ka.nums[i] ?? -1;
        const nb = kb.nums[i] ?? -1;
        if (na !== nb) return na - nb;
      }
      return 0;
    }

    // -----------------------
    // DQE list / lookup
    // -----------------------
    const dqeRows = dqe.filter(x => x.type === "row");
    const dqeByArt = new Map(dqeRows.map(r => [String(r.art).trim(), r]));

    function fillDatalist() {
      // datalist: "C3.1 — Déblai meuble mis en remblai"
      dqeArtList.innerHTML = "";
      const rowsSorted = [...dqeRows].sort((a,b)=>cmpArt(a.art,b.art));
      for (const r of rowsSorted) {
        const opt = document.createElement("option");
        opt.value = r.art;
        opt.label = `${r.art} — ${r.description}`;
        dqeArtList.appendChild(opt);
      }
    }
    fillDatalist();

    // -----------------------
    // DQE grouping (level1 collapsible)
    // -----------------------
    function buildGroups(items) {
      const groups = [];
      let current = null;

      const startGroup = (sectionItem) => {
        const id = `g_${groups.length}_${(sectionItem.label || "").slice(0,20).replace(/\s+/g,"_")}`;
        current = { id, header: sectionItem, collapsed: false, blocks: [] };
        groups.push(current);
      };

      const ensureBlock = (subHeader = null) => {
        if (!current) startGroup({ type:"section", level:1, label:"(NO SERIE)" });
        const last = current.blocks[current.blocks.length - 1];
        if (!last || last.subHeader !== subHeader) current.blocks.push({ subHeader, items: [] });
        return current.blocks[current.blocks.length - 1];
      };

      for (const it of items) {
        if (it.type === "section" && it.level === 1) { startGroup(it); continue; }
        if (it.type === "section" && it.level === 2) { ensureBlock(it); continue; }
        ensureBlock(current?.blocks?.length ? current.blocks[current.blocks.length - 1].subHeader : null).items.push(it);
      }
      return groups;
    }

    const dqeGroups = buildGroups(dqe);

    const sumCol = (rows, key) => rows.reduce((acc, r) => acc + (Number(r?.[key]) || 0), 0);
    function groupAllRows(g) {
      const rows = [];
      for (const b of g.blocks) for (const it of b.items) if (it.type === "row") rows.push(it);
      return rows;
    }

    function searchableRowText(r) {
      const parts = [
        r.art, r.description, r.um,
        r.dzd, r.euro, r.dzdEqv,
        fmt(r.dzd), fmt(r.euro), fmt(r.dzdEqv)
      ];
      return parts.map(x => (x ?? "").toString().toLowerCase()).join(" | ");
    }

    // -----------------------
    // COST helpers
    // -----------------------
    function calcMachineTotal(line) {
      return Number(line.miktar || 0) * Number(line.adet || 0) * Number(line.birimFiyatDzd || 0);
    }
    function calcLaborDayTotal(line) {
      return Number(line.saat || 0) * Number(line.adet || 0) * Number(line.birimSaatDzd || 0);
    }

    // -----------------------
    // Render DQE
    // -----------------------
    function renderDQE() {
      const needle = q.value.trim();
      const needleLower = needle.toLowerCase();
      const sortArt = sortArtEl.checked;

      // Grand totals (full data)
      const allRows = dqeRows;
      const gtd = sumCol(allRows, "dzd");
      const gte = sumCol(allRows, "euro");
      const gtq = sumCol(allRows, "dzdEqv");

      gtDzd.textContent = `${fmt(gtd)} DZD`;
      gtEuro.textContent = `${fmt(gte)} €`;
      gtEqv.textContent = `${fmt(gtq)} DZD`;
      grandChip.textContent = `Grand: ${fmt(gtd)} DZD | ${fmt(gte)} € | ${fmt(gtq)} DZD`;

      tbody.innerHTML = "";
      let visibleRowCount = 0;

      for (const g of dqeGroups) {
        const headerLabel = g.header?.label ?? "";

        // Filter: show group only if any row matches (or header matches)
        let groupMatches = false;
        const matchedRowsByBlock = new Map();

        if (needle) {
          if (headerLabel.toLowerCase().includes(needleLower)) groupMatches = true;

          for (const b of g.blocks) {
            const matched = b.items.filter(it => it.type === "row" && searchableRowText(it).includes(needleLower));
            if (matched.length) { groupMatches = true; matchedRowsByBlock.set(b, matched); }
          }
          if (!groupMatches) continue;
        }

        const collapsed = needle ? false : g.collapsed;

        // Header row
        const trH = document.createElement("tr");
        trH.className = "serie";
        const tdH = document.createElement("td");
        tdH.colSpan = 6;

        // Subtotal (full group)
        const gRows = groupAllRows(g);
        const subDzd = sumCol(gRows, "dzd");
        const subEuro = sumCol(gRows, "euro");
        const subEqv = sumCol(gRows, "dzdEqv");

        tdH.innerHTML = `
          <div class="toggle" role="button" tabindex="0" data-gid="${g.id}">
            <span class="caret">${collapsed ? "▶" : "▼"}</span>
            <span>${highlight(headerLabel, needle)}</span>
            <span class="right">
              <span class="badge">${fmt(subDzd)} DZD | ${fmt(subEuro)} €</span>
            </span>
          </div>
        `;
        trH.appendChild(tdH);
        tbody.appendChild(trH);

        if (collapsed) continue;

        for (const b of g.blocks) {
          const subHeader = b.subHeader;

          let rowsToRender = b.items.filter(it => it.type === "row");
          if (needle) {
            rowsToRender = matchedRowsByBlock.get(b) ?? [];
            if (!rowsToRender.length) continue;
          }

          if (sortArt) rowsToRender = [...rowsToRender].sort((x, y) => cmpArt(x.art, y.art));

          if (subHeader) {
            const trS = document.createElement("tr");
            trS.className = "subsection";
            const tdS = document.createElement("td");
            tdS.colSpan = 6;
            tdS.innerHTML = highlight(subHeader.label, needle);
            trS.appendChild(tdS);
            tbody.appendChild(trS);
          }

          for (const r of rowsToRender) {
            const tr = document.createElement("tr");

            const tdArt = document.createElement("td");
            tdArt.className = "art";
            tdArt.innerHTML = highlight(r.art ?? "", needle);
            tr.appendChild(tdArt);

            const tdDesc = document.createElement("td");
            tdDesc.innerHTML = highlight(r.description ?? "", needle);
            tr.appendChild(tdDesc);

            const tdUm = document.createElement("td");
            tdUm.innerHTML = highlight(r.um ?? "", needle);
            tr.appendChild(tdUm);

            const tdDzd = document.createElement("td");
            tdDzd.className = "num";
            tdDzd.innerHTML = highlight(r.dzd != null ? `${fmt(r.dzd)} DZD` : "-", needle);
            tr.appendChild(tdDzd);

            const tdEuro = document.createElement("td");
            tdEuro.className = "num";
            tdEuro.innerHTML = highlight(r.euro != null ? `${fmt(r.euro)} €` : "- €", needle);
            tr.appendChild(tdEuro);

            const tdEqv = document.createElement("td");
            tdEqv.className = "num";
            tdEqv.innerHTML = highlight(r.dzdEqv != null ? `${fmt(r.dzdEqv)} DZD` : "-", needle);
            tr.appendChild(tdEqv);

            tbody.appendChild(tr);
            visibleRowCount++;
          }
        }

        // Subtotal row (filtre yokken göster)
        if (!needle) {
          const trSub = document.createElement("tr");
          trSub.className = "subtotal";
          trSub.innerHTML = `
            <td colspan="3">SUBTOTAL (SERIE)</td>
            <td class="num">${fmt(subDzd)} DZD</td>
            <td class="num">${fmt(subEuro)} €</td>
            <td class="num">${fmt(subEqv)} DZD</td>
          `;
          tbody.appendChild(trSub);
        }
      }

      countEl.textContent = `${visibleRowCount} satır`;
    }

    // -----------------------
    // Render COST (Makina & İşçilik + POZ çekme)
    // -----------------------
    function renderCOST() {
      const needle = q.value.trim();
      const needleLower = needle.toLowerCase();

      // DQE butonları bu ekranda pasif
      expandAllBtn.disabled = true;
      collapseAllBtn.disabled = true;
      sortArtEl.disabled = true;

      const p = sheet.unitPanel;
      const totalKm = Number(p.trip_km_loaded_empty || 0) * Number(p.trip_count || 0);

      const makinaTotal = sheet.makina.reduce((a, x) => a + calcMachineTotal(x), 0);
      const iscilikTotal = sheet.iscilik.reduce((a, x) => a + calcLaborDayTotal(x), 0);
      const dailyTotalCost = makinaTotal + iscilikTotal;

      const dailyM3 = Number(p.daily_excavation_m3 || 0);
      const internalUnitCost = dailyM3 > 0 ? (dailyTotalCost / dailyM3) : 0; // DZD / m3

      // Seçili POZ verisi
      const poz = dqeByArt.get(String(selectedPozArt).trim()) || null;

      // POZ "seçilen kolon" değeri
      const pozValue = poz ? (poz[selectedPozColumn] ?? null) : null;

      // karşılaştırma
      const diff = (pozValue != null) ? (Number(pozValue) - internalUnitCost) : null;
      const diffPct = (pozValue != null && Number(pozValue) !== 0) ? (diff / Number(pozValue) * 100) : null;

      // Footer (cost ekranında euro/eqv yok)
      gtDzd.textContent = `${fmt(dailyTotalCost)} DZD`;
      gtEuro.textContent = `-`;
      gtEqv.textContent = `-`;
      grandChip.textContent = `Günlük toplam: ${fmt(dailyTotalCost)} DZD | Birim maliyet: ${fmt(internalUnitCost)} DZD/m³`;

      tbody.innerHTML = "";

      // Panel row (Ölçü Birimi + Poz seçimi + Birim maliyet kartı)
      const panelTr = document.createElement("tr");
      panelTr.className = "serie";
      const panelTd = document.createElement("td");
      panelTd.colSpan = 6;

      panelTd.innerHTML = `
        <div class="panelBox">
          <div style="font-weight:900;">ÖLÇÜ BİRİMİ</div>

          <div class="panelGrid">
            <div>günlük kazı (m³)</div>
            <input data-k="daily_excavation_m3" type="number" step="1" value="${p.daily_excavation_m3}" />

            <div>sefer (dolu+boş) /km</div>
            <input data-k="trip_km_loaded_empty" type="number" step="0.1" value="${p.trip_km_loaded_empty}" />

            <div>kasa hacim (m³)</div>
            <input data-k="bucket_volume_m3" type="number" step="0.1" value="${p.bucket_volume_m3}" />

            <div>sefer adet</div>
            <input data-k="trip_count" type="number" step="1" value="${p.trip_count}" />

            <div style="font-weight:800;">toplam km</div>
            <div style="font-weight:900;">${fmt(totalKm)} km</div>
          </div>

          <div class="card">
            <h3>POZ seç → DQE’den çek</h3>
            <div class="small muted" style="margin-bottom:8px;">
              Örn: C3.1, C4.3, C9.1...
            </div>

            <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;">
              <input id="pozInput" list="dqeArtList" placeholder="ART yaz/ seç (örn C3.1)" value="${esc(selectedPozArt)}"
                     style="padding:8px;border:1px solid #d1d5db;border-radius:10px; min-width:180px;" />

              <select id="pozCol" style="padding:8px;border:1px solid #d1d5db;border-radius:10px;">
                <option value="dzd" ${selectedPozColumn==="dzd"?"selected":""}>POZ fiyat: DZD</option>
                <option value="dzdEqv" ${selectedPozColumn==="dzdEqv"?"selected":""}>POZ fiyat: DZDéqv</option>
                <option value="euro" ${selectedPozColumn==="euro"?"selected":""}>POZ fiyat: Euro</option>
              </select>
            </div>

            <div class="kv">
              <div>Seçili POZ</div>
              <div>${poz ? esc(poz.art) : "-"}</div>

              <div>Açıklama</div>
              <div style="text-align:right; font-weight:600;">${poz ? esc(poz.description) : "-"}</div>

              <div>UM</div>
              <div>${poz ? esc(poz.um) : "-"}</div>

              <div>POZ birim fiyat</div>
              <div>${pozValue != null ? fmt(pozValue) : "-"}</div>

              <div>Senin birim maliyet</div>
              <div>${dailyM3>0 ? fmt(internalUnitCost) : "-"} DZD/m³</div>

              <div>Fark (POZ - maliyet)</div>
              <div>${diff != null ? fmt(diff) : "-"}</div>

              <div>Fark (%)</div>
              <div>${diffPct != null ? fmt(diffPct) + "%" : "-"}</div>
            </div>
          </div>

          <div style="margin-left:auto; display:flex; gap:10px; flex-wrap:wrap;">
            <span class="badge">Makina: ${fmt(makinaTotal)} DZD</span>
            <span class="badge">İşçilik: ${fmt(iscilikTotal)} DZD</span>
            <span class="badge">Günlük: ${fmt(dailyTotalCost)} DZD</span>
            <span class="badge">Birim: ${dailyM3>0 ? fmt(internalUnitCost) : "-"} DZD/m³</span>
          </div>
        </div>
      `;
      panelTr.appendChild(panelTd);
      tbody.appendChild(panelTr);

      // panel input listeners
      panelTd.querySelectorAll("input[data-k]").forEach(inp => {
        inp.addEventListener("input", () => {
          const k = inp.getAttribute("data-k");
          sheet.unitPanel[k] = Number(inp.value);
          render(); // refresh
        });
      });

      // poz input listeners
      const pozInput = panelTd.querySelector("#pozInput");
      const pozCol = panelTd.querySelector("#pozCol");

      pozInput.addEventListener("input", () => {
        selectedPozArt = pozInput.value.trim();
        localStorage.setItem(LS_KEY, selectedPozArt);
        render();
      });

      pozCol.addEventListener("change", () => {
        selectedPozColumn = pozCol.value;
        localStorage.setItem("selected_poz_col_v1", selectedPozColumn);
        render();
      });

      // Sections
      addSubSection("MAKİNA");
      let shownM = 0;
      for (const ln of sheet.makina) {
        const total = calcMachineTotal(ln);
        const hay = `${ln.cinsi} ${ln.um} ${ln.miktar} ${ln.adet} ${ln.birimFiyatDzd} ${total}`.toLowerCase();
        if (needleLower && !hay.includes(needleLower)) continue;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="art">${highlight(ln.cinsi, needle)}</td>
          <td>${highlight("Kira Bedeli", needle)}</td>
          <td>${highlight(ln.um, needle)}</td>
          <td class="num">${highlight(`${fmt(ln.birimFiyatDzd)} DZD`, needle)}</td>
          <td class="num">${highlight(`${fmt(total)} DZD`, needle)}</td>
          <td class="num">${highlight(`miktar:${ln.miktar} adet:${ln.adet}`, needle)}</td>
        `;
        tbody.appendChild(tr);
        shownM++;
      }
      if (shownM === 0) addEmpty("Eşleşen makina satırı yok.");

      addSubtotal(`SUBTOTAL (MAKİNA)`, makinaTotal);

      addSubSection("İŞÇİLİK");
      let shownL = 0;
      for (const ln of sheet.iscilik) {
        const total = calcLaborDayTotal(ln);
        const hay = `${ln.grup} ${ln.pozisyon} ${ln.um} ${ln.saat} ${ln.adet} ${ln.birimSaatDzd} ${total} ${ln.maasDzd}`.toLowerCase();
        if (needleLower && !hay.includes(needleLower)) continue;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="art">${highlight(ln.grup, needle)}</td>
          <td>${highlight(ln.pozisyon, needle)}</td>
          <td>${highlight(ln.um, needle)}</td>
          <td class="num">${highlight(`${fmt(ln.birimSaatDzd)} DZD / saat`, needle)}</td>
          <td class="num">${highlight(`${fmt(total)} DZD / gün`, needle)}</td>
          <td class="num">${highlight(`maaş: ${fmt(ln.maasDzd)} DZD`, needle)}</td>
        `;
        tbody.appendChild(tr);
        shownL++;
      }
      if (shownL === 0) addEmpty("Eşleşen işçilik satırı yok.");

      addSubtotal(`SUBTOTAL (İŞÇİLİK)`, iscilikTotal);

      countEl.textContent = `Makina: ${shownM} | İşçilik: ${shownL}`;
    }

    function addSubSection(label) {
      const tr = document.createElement("tr");
      tr.className = "subsection";
      const td = document.createElement("td");
      td.colSpan = 6;
      td.textContent = label;
      tr.appendChild(td);
      tbody.appendChild(tr);
    }

    function addSubtotal(label, totalDzd) {
      const tr = document.createElement("tr");
      tr.className = "subtotal";
      tr.innerHTML = `
        <td colspan="3">${label}</td>
        <td class="num">${fmt(totalDzd)} DZD</td>
        <td class="num">-</td>
        <td class="num">-</td>
      `;
      tbody.appendChild(tr);
    }

    function addEmpty(msg) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td colspan="6" class="muted">${msg}</td>`;
      tbody.appendChild(tr);
    }

    // -----------------------
    // Main render switch
    // -----------------------
    function render() {
      if (currentView === "dqe") {
        expandAllBtn.disabled = false;
        collapseAllBtn.disabled = false;
        sortArtEl.disabled = false;
        renderDQE();
      } else {
        renderCOST();
      }
    }

    // -----------------------
    // UI events
    // -----------------------
    clearBtn.addEventListener("click", () => {
      q.value = "";
      render();
      q.focus();
    });

    q.addEventListener("input", () => render());

    viewSel.addEventListener("change", () => {
      currentView = viewSel.value;
      render();
    });

    expandAllBtn.addEventListener("click", () => {
      for (const g of dqeGroups) g.collapsed = false;
      render();
    });

    collapseAllBtn.addEventListener("click", () => {
      for (const g of dqeGroups) g.collapsed = true;
      render();
    });

    sortArtEl.addEventListener("change", render);

    // DQE collapse click
    tbody.addEventListener("click", (e) => {
      if (currentView !== "dqe") return;
      const btn = e.target.closest("[data-gid]");
      if (!btn) return;
      if (q.value.trim()) return; // filtre açıkken collapse kilitli

      const gid = btn.getAttribute("data-gid");
      const g = dqeGroups.find(x => x.id === gid);
      if (!g) return;
      g.collapsed = !g.collapsed;
      render();
    });

    // first render
    render();
  </script>
</body>
</html>
