<!doctype html>
<html lang="tr">
<head> 
  <meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow, noarchive">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MASTER DQE</title>
  <style>
    :root{
      --bg:#f5f7fb;
      --card:#ffffff;
      --muted:#6b7280;
      --text:#111827;
      --line:#e5e7eb;
      --line2:#eef2f7;
      --soft:#f9fafb;
      --accent:#111827;
      --warn:#b45309;

      --r:16px;
      --r2:12px;

      --h:40px;           /* input/select height */
      --pad:12px;
      --shadow: 0 14px 40px rgba(17,24,39,.08);
      --shadow2: 0 10px 24px rgba(17,24,39,.06);
    }

    *{ box-sizing:border-box; }
    body{
      margin:0; padding:18px;
      font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
      background:var(--bg); color:var(--text);
    }
<div id="lock" style="
  position:fixed; inset:0; z-index:9999;
  display:flex; align-items:center; justify-content:center;
  background:rgba(245,247,251,.92); backdrop-filter: blur(6px);
">
  <div style="
    width:min(420px, 92vw);
    background:#fff; border:1px solid #e5e7eb; border-radius:18px;
    box-shadow: 0 20px 60px rgba(17,24,39,.10);
    padding:16px;
    font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial;
  ">
    <div style="font-weight:900; font-size:16px; margin-bottom:8px;">Giriş</div>
    <div style="color:#6b7280; font-size:12px; margin-bottom:12px;">
      Şifreyi gir
    </div>

    <input id="pass" type="password" placeholder="Şifre"
      style="width:100%; height:42px; border-radius:12px; border:1px solid #e5e7eb; padding:0 12px; outline:none; font-weight:700;"
    />

    <div style="display:flex; gap:10px; margin-top:10px;">
      <button id="loginBtn" type="button"
        style="height:42px; border-radius:12px; border:1px solid #111827; background:#111827; color:#fff; font-weight:900; padding:0 14px; cursor:pointer;">
        Gir
      </button>
      <div id="msg" style="margin-left:auto; align-self:center; color:#b45309; font-weight:900; font-size:12px;"></div>
    </div>
  </div>
</div>

    .app{
      max-width:1280px; margin:0 auto;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--r);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .topbar{
      padding:16px 16px 10px;
      display:flex; align-items:center; gap:12px; flex-wrap:wrap;
      border-bottom:1px solid var(--line);
      background: linear-gradient(180deg,#ffffff, #fbfcfe);
    }
    .title{
      font-weight:900; letter-spacing:.2px;
      font-size:18px;
      margin-right:8px;
    }
    .grow{ flex:1; }

    .ctrlRow{
      padding:12px 16px;
      display:flex; gap:10px; flex-wrap:wrap; align-items:center;
      border-bottom:1px solid var(--line2);
      background:var(--soft);
    }

    .input, .select, .btn{
      height:var(--h);
      border-radius:12px;
      border:1px solid var(--line);
      background:#fff;
      padding:0 12px;
      font-size:13px;
      outline:none;
    }
    .input{ min-width: 320px; }
    .select{ min-width: 190px; }
    .input:focus, .select:focus{ border-color:#c7ccd6; box-shadow:0 0 0 4px rgba(17,24,39,.06); }

    .btn{
      cursor:pointer;
      font-weight:700;
      background:#fff;
    }
    .btn:hover{ background:#f3f4f6; }
    .btn.primary{
      background:var(--accent); color:#fff; border-color:var(--accent);
    }
    .btn.primary:hover{ filter:brightness(.95); }

    .pill{
      height:var(--h);
      display:inline-flex; align-items:center; gap:8px;
      padding:0 12px;
      border-radius:999px;
      border:1px solid var(--line);
      background:#fff;
      font-size:12px;
      color:#374151;
      white-space:nowrap;
    }

    /* Table */
    .tableWrap{ width:100%; overflow:auto; }
    table{ width:100%; border-collapse:collapse; font-size:13px; }
    thead th{
      position:sticky; top:0; z-index:2;
      background:#ffffff;
      border-bottom:1px solid var(--line);
      padding:12px 10px;
      text-align:left;
      color:#374151;
      font-size:12px;
      letter-spacing:.2px;
    }
    t td, tfoot td{ border-bottom:1px solid var(--line2); padding:12px 10px; vertical-align:top; }
    t tr:hover td{ background:#fcfcfd; }

    tfoot td{
      background:#0b1220; color:#fff; font-weight:900;
      border-bottom:none;
    }

    .num{ text-align:right; font-variant-numeric: tabular-nums; white-space:nowrap; }
    .art{ font-weight:900; white-space:nowrap; }
    mark{ background:#ffe08a; padding:0 2px; border-radius:6px; }

    /* DQE headers */
    .serie td{
      background:#fff7d6;
      font-weight:900;
      border-bottom:1px solid #f1e3a6;
    }
    .subsection td{
      background:#fff2bf;
      font-weight:800;
      border-bottom:1px solid #f1e3a6;
    }
    .subtotal td{
      background:#f3f4f6;
      font-weight:900;
    }

    /* Toggle */
    .toggle{
      display:flex; align-items:center; gap:10px;
      user-select:none;
    }
    .caret{
      width:22px; height:22px;
      border-radius:8px;
      border:1px solid var(--line);
      display:inline-flex; align-items:center; justify-content:center;
      background:#fff;
      font-size:12px;
    }
    .toggleRight{ margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }

    .badge{
      display:inline-flex; align-items:center;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid var(--line);
      background:#fff;
      font-size:12px;
      font-weight:800;
      white-space:nowrap;
    }

    /* COST layout */
    .panel{
      display:grid;
      grid-template-columns: 1.1fr 1.2fr 0.9fr;
      gap:12px;
      align-items:start;
    }
    @media (max-width: 1050px){
      .panel{ grid-template-columns:1fr; }
      .input{ min-width: 220px; width:100%; }
      .select{ width:100%; }
    }

    .card{
      background:#fff;
      border:1px solid var(--line);
      border-radius:var(--r2);
      box-shadow:var(--shadow2);
      padding:12px;
    }
    .card h3{
      margin:0 0 10px;
      font-size:13px;
      font-weight:900;
    }
    .gridForm{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
      align-items:center;
    }
    .gridForm .label{ font-size:12px; color:var(--muted); }
    .gridForm .val{ font-weight:900; text-align:right; }
    .mini{ font-size:12px; color:var(--muted); }

    .chips{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
    .chipItem{
      display:inline-flex; align-items:center; gap:10px;
      padding:8px 10px;
      border-radius:999px;
      border:1px solid var(--line);
      background:#fff;
      font-size:12px;
      font-weight:800;
    }
    .chipItem button{
      width:22px; height:22px;
      border-radius:8px;
      border:1px solid var(--line);
      background:#fff;
      cursor:pointer;
      font-weight:900;
      line-height:1;
    }
    .chipItem button:hover{ background:#f3f4f6; }

    /* POZ cards */
    .pozCard{
      border:1px solid var(--line);
      border-radius:var(--r);
      background:#fff;
      box-shadow:var(--shadow2);
      padding:12px;
      margin: 12px 0;
    }
    .pozTop{
      display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap;
    }
    .pozTop .desc{ color:var(--muted); font-size:12px; line-height:1.3; }
    .pozTop .right{
      margin-left:auto;
      display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;
    }
    .warn{ color:var(--warn); font-weight:900; }

    .pozActions{
      margin-top:10px;
      display:flex; gap:10px; flex-wrap:wrap; align-items:center;
      padding:10px;
      border-radius:12px;
      background:var(--soft);
      border:1px solid var(--line2);
    }
    .pozActions .inputSmall{
      height:var(--h);
      width:160px;
      border-radius:12px;
      border:1px solid var(--line);
      padding:0 12px;
      outline:none;
      font-weight:800;
    }

    .twoCols{
      margin-top:12px;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:12px;
      align-items:start;
    }
    @media (max-width: 900px){
      .twoCols{ grid-template-columns:1fr; }
    }

    .box{
      border:1px solid var(--line);
      border-radius:14px;
      padding:12px;
      background:#fff;
    }
    .boxTitle{
      font-weight:900;
      margin-bottom:10px;
      display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    }
    .rowHead, .rowLine{
      display:grid;
      grid-template-columns: 1.6fr .65fr .65fr .8fr .9fr 40px;
      gap:8px;
      align-items:center;
    }
    .rowHead{
      font-size:11px;
      color:var(--muted);
      margin-bottom:8px;
      padding:0 2px;
    }
    .rowLine input{
      height:36px;
      border-radius:12px;
      border:1px solid var(--line);
      padding:0 10px;
      font-size:12px;
      outline:none;
      background:#fff;
    }
    .rowLine input:focus{ border-color:#c7ccd6; box-shadow:0 0 0 4px rgba(17,24,39,.06); }
    .xbtn{
      height:36px;
      border-radius:12px;
      border:1px solid var(--line);
      background:#fff;
      cursor:pointer;
      font-weight:900;
    }
    .xbtn:hover{ background:#f3f4f6; }

    .lineTotal{
      margin:6px 0 10px;
      font-size:11px;
      color:var(--muted);
    }
  </style>
</head>

<>
  <div class="app">
    <div class="topbar">
      <div class="title">MASTER DQE</div>
      <div class="grow"></div>
      <div class="pill" id="grandChip">—</div>
    </div>

    <div class="ctrlRow">
      <select class="select" id="viewSel">
        <option value="dqe">DQE</option>
        <option value="cost">Makina & İşçilik</option>
      </select>

      <input class="input" id="q" type="text" placeholder="Hızlı filtre (ART / açıklama / UM / fiyat)…" />
      <button class="btn" id="clearBtn">Temizle</button>

      <button class="btn" id="expandAll">Tümünü Aç</button>
      <button class="btn" id="collapseAll">Tümünü Kapat</button>

      <label class="pill" style="cursor:pointer;">
        <input type="checkbox" id="sortArt" />
        ART’a göre sırala
      </label>

      <div class="pill" id="count">—</div>
    </div>

    <div class="tableWrap">
      <table>
        <thead>
          <tr>
            <th style="width:140px">ART</th>
            <th>DESCRIPTION</th>
            <th style="width:90px">UM</th>
            <th class="num" style="width:170px">DZD</th>
            <th class="num" style="width:140px">Euro</th>
            <th class="num" style="width:190px">DZDéqv</th>
          </tr>
        </thead>
        <t id="t"></t>
        <tfoot>
          <tr>
            <td colspan="3">GRAND TOTAL</td>
            <td class="num" id="gtDzd"></td>
            <td class="num" id="gtEuro"></td>
            <td class="num" id="gtEqv"></td>
          </tr>
        </tfoot>
      </table>
    </div>

    <datalist id="dqeArtList"></datalist>
  </div>

  <script type="module">
    import { dqe, costSheets } from "./database.js";

    const t = document.getElementById("t");
    const q = document.getElementById("q");
    const clearBtn = document.getElementById("clearBtn");
    const expandAllBtn = document.getElementById("expandAll");
    const collapseAllBtn = document.getElementById("collapseAll");
    const sortArtEl = document.getElementById("sortArt");
    const countEl = document.getElementById("count");
    const grandChip = document.getElementById("grandChip");
    const viewSel = document.getElementById("viewSel");

    const gtDzd = document.getElementById("gtDzd");
    const gtEuro = document.getElementById("gtEuro");
    const gtEqv = document.getElementById("gtEqv");
    const dqeArtList = document.getElementById("dqeArtList");

    let currentView = "dqe";
    const sheet = costSheets[0];

    const fmt = (v) => {
      if (v === null || v === undefined || Number.isNaN(Number(v))) return "-";
      return new Intl.NumberFormat("tr-TR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(Number(v));
    };
    const esc = (s) => (s ?? "").toString()
      .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
      .replaceAll('"',"&quot;").replaceAll("'","&#039;");

    function highlight(text, needle) {
      const t = (text ?? "").toString();
      if (!needle) return esc(t);
      const n = needle.toLowerCase();
      const idx = t.toLowerCase().indexOf(n);
      if (idx === -1) return esc(t);
      return `${esc(t.slice(0,idx))}<mark>${esc(t.slice(idx, idx+needle.length))}</mark>${esc(t.slice(idx+needle.length))}`;
    }

    function artKey(art) {
      const s = (art || "").trim();
      const m = s.match(/^([A-Za-z]+)\s*(.*)$/);
      const letters = (m?.[1] || "").toUpperCase();
      const rest = (m?.[2] || "").replace(/[^\d.]/g, "");
      const nums = rest ? rest.split(".").filter(Boolean).map(n => parseInt(n, 10)) : [];
      return { letters, nums };
    }
    function cmpArt(a, b) {
      const ka = artKey(a), kb = artKey(b);
      if (ka.letters !== kb.letters) return ka.letters < kb.letters ? -1 : 1;
      const len = Math.max(ka.nums.length, kb.nums.length);
      for (let i=0;i<len;i++){
        const na = ka.nums[i] ?? -1;
        const nb = kb.nums[i] ?? -1;
        if (na !== nb) return na - nb;
      }
      return 0;
    }

    // DQE index
    const dqeRows = dqe.filter(x => x.type === "row");
    const dqeByArt = new Map(dqeRows.map(r => [String(r.art).trim(), r]));

    function fillDatalist() {
      dqeArtList.innerHTML = "";
      const rowsSorted = [...dqeRows].sort((a,b)=>cmpArt(a.art,b.art));
      for (const r of rowsSorted) {
        const opt = document.createElement("option");
        opt.value = r.art;
        opt.label = `${r.art} — ${r.description}`;
        dqeArtList.appendChild(opt);
      }
    }
    fillDatalist();

    function buildGroups(items) {
      const groups = [];
      let current = null;

      const startGroup = (sectionItem) => {
        const id = `g_${groups.length}_${(sectionItem.label || "").slice(0,20).replace(/\s+/g,"_")}`;
        current = { id, header: sectionItem, collapsed: false, blocks: [] };
        groups.push(current);
      };

      const ensureBlock = (subHeader = null) => {
        if (!current) startGroup({ type:"section", level:1, label:"(NO SERIE)" });
        const last = current.blocks[current.blocks.length - 1];
        if (!last || last.subHeader !== subHeader) current.blocks.push({ subHeader, items: [] });
        return current.blocks[current.blocks.length - 1];
      };

      for (const it of items) {
        if (it.type === "section" && it.level === 1) { startGroup(it); continue; }
        if (it.type === "section" && it.level === 2) { ensureBlock(it); continue; }
        ensureBlock(current?.blocks?.length ? current.blocks[current.blocks.length - 1].subHeader : null).items.push(it);
      }
      return groups;
    }
    const dqeGroups = buildGroups(dqe);

    const sumCol = (rows, key) => rows.reduce((acc, r) => acc + (Number(r?.[key]) || 0), 0);
    function groupAllRows(g) {
      const rows = [];
      for (const b of g.blocks) for (const it of b.items) if (it.type === "row") rows.push(it);
      return rows;
    }
    function searchableRowText(r) {
      const parts = [r.art, r.description, r.um, r.dzd, r.euro, r.dzdEqv, fmt(r.dzd), fmt(r.euro), fmt(r.dzdEqv)];
      return parts.map(x => (x ?? "").toString().toLowerCase()).join(" | ");
    }

    // COST state
    const LS_STATE = "cost_state_v2";
    const defaultState = () => ({
      pozCol: "dzdEqv",
      pozList: [],
      unitPanel: {
        daily_excavation_m3: sheet.unitPanel?.daily_excavation_m3 ?? 2700,
        trip_km_loaded_empty: sheet.unitPanel?.trip_km_loaded_empty ?? 10,
        bucket_volume_m3: sheet.unitPanel?.bucket_volume_m3 ?? 9,
        trip_count: sheet.unitPanel?.trip_count ?? 15
      },
      poz: {}
    });

    let costState = (() => {
      try {
        const raw = localStorage.getItem(LS_STATE);
        if (!raw) return defaultState();
        const obj = JSON.parse(raw);
        if (!obj || typeof obj !== "object") return defaultState();
        obj.pozList = Array.isArray(obj.pozList) ? obj.pozList : [];
        obj.poz = obj.poz && typeof obj.poz === "object" ? obj.poz : {};
        obj.unitPanel = obj.unitPanel && typeof obj.unitPanel === "object" ? obj.unitPanel : defaultState().unitPanel;
        obj.pozCol = obj.pozCol || "dzdEqv";
        return obj;
      } catch { return defaultState(); }
    })();

    function saveCostState(){ localStorage.setItem(LS_STATE, JSON.stringify(costState)); }
    function ensurePoz(art){
      const a = String(art||"").trim();
      if (!a) return null;
      if (!costState.poz[a]){
        costState.poz[a] = { production: Number(costState.unitPanel.daily_excavation_m3 || 0), machines: [], labor: [] };
      }
      return costState.poz[a];
    }
    function addPoz(art){
      const a = String(art||"").trim();
      if (!a) return;
      if (!costState.pozList.includes(a)){
        costState.pozList.push(a);
        costState.pozList.sort((x,y)=>cmpArt(x,y));
        ensurePoz(a);
        saveCostState();
      }
    }
    function removePoz(art){
      const a = String(art||"").trim();
      costState.pozList = costState.pozList.filter(x=>x!==a);
      saveCostState();
    }
    function clearPozList(){ costState.pozList = []; saveCostState(); }

    const machineTemplates = sheet.makina.map((m, idx) => ({ idx, ...m }));
    const laborTemplates   = sheet.iscilik.map((l, idx) => ({ idx, ...l }));
    const makeId = () => "id_" + Math.random().toString(16).slice(2) + "_" + Date.now().toString(16);

    function addMachineLine(pozArt, templateIdx){
      const p = ensurePoz(pozArt);
      const t = machineTemplates.find(x => x.idx === Number(templateIdx));
      if (!p || !t) return;
      p.machines.push({ id: makeId(), name:t.cinsi, um:t.um, miktar:+t.miktar, adet:+t.adet, birimFiyatDzd:+t.birimFiyatDzd });
      saveCostState();
    }
    function addLaborLine(pozArt, templateIdx){
      const p = ensurePoz(pozArt);
      const t = laborTemplates.find(x => x.idx === Number(templateIdx));
      if (!p || !t) return;
      p.labor.push({ id: makeId(), grup:t.grup, pozisyon:t.pozisyon, um:t.um, saat:+t.saat, adet:+t.adet, birimSaatDzd:+t.birimSaatDzd, maasDzd:+t.maasDzd });
      saveCostState();
    }
    function removeLine(pozArt, type, id){
      const p = ensurePoz(pozArt);
      if (!p) return;
      if (type==="m") p.machines = p.machines.filter(x=>x.id!==id);
      if (type==="l") p.labor    = p.labor.filter(x=>x.id!==id);
      saveCostState();
    }
    const machineLineTotal = (x)=> (+x.miktar||0) * (+x.adet||0) * (+x.birimFiyatDzd||0);
    const laborLineTotal   = (x)=> (+x.saat||0) * (+x.adet||0) * (+x.birimSaatDzd||0);
    function pozTotals(pozArt){
      const p = ensurePoz(pozArt);
      const m = p.machines.reduce((a,x)=>a+machineLineTotal(x),0);
      const l = p.labor.reduce((a,x)=>a+laborLineTotal(x),0);
      const total = m+l;
      const prod = +p.production||0;
      const unit = prod>0 ? total/prod : 0;
      return {m,l,total,prod,unit};
    }

    // DQE view
    function renderDQE(){
      const needle = q.value.trim();
      const nl = needle.toLowerCase();
      const sortArt = sortArtEl.checked;

      const gtd = sumCol(dqeRows, "dzd");
      const gte = sumCol(dqeRows, "euro");
      const gtq = sumCol(dqeRows, "dzdEqv");

      gtDzd.textContent = `${fmt(gtd)} DZD`;
      gtEuro.textContent = `${fmt(gte)} €`;
      gtEqv.textContent = `${fmt(gtq)} DZD`;
      grandChip.textContent = `Grand: ${fmt(gtd)} DZD | ${fmt(gte)} € | ${fmt(gtq)} DZD`;

      t.innerHTML="";
      let visible = 0;

      for (const g of dqeGroups){
        const headerLabel = g.header?.label ?? "";

        let groupMatches = false;
        const matchedRowsByBlock = new Map();

        if (needle){
          if (headerLabel.toLowerCase().includes(nl)) groupMatches = true;
          for (const b of g.blocks){
            const matched = b.items.filter(it => it.type==="row" && searchableRowText(it).includes(nl));
            if (matched.length){ groupMatches=true; matchedRowsByBlock.set(b, matched); }
          }
          if (!groupMatches) continue;
        }

        const collapsed = needle ? false : g.collapsed;

        const gRows = groupAllRows(g);
        const subDzd = sumCol(gRows, "dzd");
        const subEuro = sumCol(gRows, "euro");
        const subEqv = sumCol(gRows, "dzdEqv");

        const trH = document.createElement("tr");
        trH.className = "serie";
        trH.innerHTML = `
          <td colspan="6">
            <div class="toggle" role="button" tabindex="0" data-gid="${g.id}">
              <span class="caret">${collapsed ? "▶" : "▼"}</span>
              <span>${highlight(headerLabel, needle)}</span>
              <span class="toggleRight">
                <span class="badge">${fmt(subDzd)} DZD</span>
                <span class="badge">${fmt(subEuro)} €</span>
              </span>
            </div>
          </td>
        `;
        t.appendChild(trH);
        if (collapsed) continue;

        for (const b of g.blocks){
          const subHeader = b.subHeader;
          let rowsToRender = b.items.filter(it => it.type==="row");
          if (needle){
            rowsToRender = matchedRowsByBlock.get(b) ?? [];
            if (!rowsToRender.length) continue;
          }
          if (sortArt) rowsToRender = [...rowsToRender].sort((x,y)=>cmpArt(x.art,y.art));

          if (subHeader){
            const trS = document.createElement("tr");
            trS.className="subsection";
            trS.innerHTML = `<td colspan="6">${highlight(subHeader.label, needle)}</td>`;
            t.appendChild(trS);
          }

          for (const r of rowsToRender){
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td class="art">${highlight(r.art ?? "", needle)}</td>
              <td>${highlight(r.description ?? "", needle)}</td>
              <td>${highlight(r.um ?? "", needle)}</td>
              <td class="num">${highlight(r.dzd != null ? `${fmt(r.dzd)} DZD` : "-", needle)}</td>
              <td class="num">${highlight(r.euro != null ? `${fmt(r.euro)} €` : "- €", needle)}</td>
              <td class="num">${highlight(r.dzdEqv != null ? `${fmt(r.dzdEqv)} DZD` : "-", needle)}</td>
            `;
            t.appendChild(tr);
            visible++;
          }
        }

        if (!needle){
          const trSub = document.createElement("tr");
          trSub.className="subtotal";
          trSub.innerHTML = `
            <td colspan="3">SUBTOTAL (SERIE)</td>
            <td class="num">${fmt(subDzd)} DZD</td>
            <td class="num">${fmt(subEuro)} €</td>
            <td class="num">${fmt(subEqv)} DZD</td>
          `;
          t.appendChild(trSub);
        }
      }

      countEl.textContent = `${visible} satır`;
    }

    // COST view
    function renderCOST(){
      expandAllBtn.disabled = true;
      collapseAllBtn.disabled = true;
      sortArtEl.disabled = true;

      t.innerHTML = "";

      let grandTotal = 0;
      for (const a of costState.pozList) grandTotal += pozTotals(a).total;

      gtDzd.textContent = `${fmt(grandTotal)} DZD`;
      gtEuro.textContent = `-`;
      gtEqv.textContent = `-`;
      grandChip.textContent = `POZ toplamları: ${fmt(grandTotal)} DZD`;

      // top panel as a single row (clean)
      const p = costState.unitPanel;
      const totalKm = (+p.trip_km_loaded_empty||0) * (+p.trip_count||0);

      const trTop = document.createElement("tr");
      trTop.className = "serie";
      trTop.innerHTML = `
        <td colspan="6">
          <div class="panel">
            <div class="card">
              <h3>Ölçü birimi (Global)</h3>
              <div class="gridForm">
                <div class="label">günlük kazı (m³)</div>
                <div class="val"><input class="input" style="min-width:0;width:100%;" data-act="setUnit" data-k="daily_excavation_m3" type="number" step="1" value="${esc(p.daily_excavation_m3)}"></div>

                <div class="label">sefer (dolu+boş) /km</div>
                <div class="val"><input class="input" style="min-width:0;width:100%;" data-act="setUnit" data-k="trip_km_loaded_empty" type="number" step="0.1" value="${esc(p.trip_km_loaded_empty)}"></div>

                <div class="label">kasa hacim (m³)</div>
                <div class="val"><input class="input" style="min-width:0;width:100%;" data-act="setUnit" data-k="bucket_volume_m3" type="number" step="0.1" value="${esc(p.bucket_volume_m3)}"></div>

                <div class="label">sefer adet</div>
                <div class="val"><input class="input" style="min-width:0;width:100%;" data-act="setUnit" data-k="trip_count" type="number" step="1" value="${esc(p.trip_count)}"></div>

                <div class="label">toplam km</div>
                <div class="val">${fmt(totalKm)} km</div>
              </div>
            </div>

            <div class="card">
              <h3>POZ seç → ekle</h3>
              <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
                <input class="input" id="pozPick" list="dqeArtList" placeholder="ART seç (örn C3.1)" value="" style="min-width:200px;">
                <button class="btn primary" data-act="addPoz" type="button">Ekle</button>
                <button class="btn" data-act="clearPoz" type="button">Temizle</button>
                <select class="select" data-act="setPozCol">
                  <option value="dzd" ${costState.pozCol==="dzd"?"selected":""}>POZ fiyat: DZD</option>
                  <option value="dzdEqv" ${costState.pozCol==="dzdEqv"?"selected":""}>POZ fiyat: DZDéqv</option>
                  <option value="euro" ${costState.pozCol==="euro"?"selected":""}>POZ fiyat: Euro</option>
                </select>
              </div>

              ${
                costState.pozList.length
                ? `<div class="chips">
                    ${costState.pozList.map(a => `
                      <span class="chipItem">
                        ${esc(a)}
                        <button type="button" data-act="removePoz" data-art="${esc(a)}">×</button>
                      </span>
                    `).join("")}
                  </div>`
                : `<div class="mini" style="margin-top:10px;">Henüz POZ eklemedin.</div>`
              }
              <div class="mini" style="margin-top:10px;">
                Makina/işçilik dropdownları POZ kartının içinde.
              </div>
            </div>

            <div class="card">
              <h3>Özet</h3>
              <div class="gridForm">
                <div class="label">Seçili POZ</div><div class="val">${costState.pozList.length}</div>
                <div class="label">Toplam</div><div class="val">${fmt(grandTotal)} DZD</div>
              </div>
              <div class="mini" style="margin-top:10px;">
                Not: Euro seçersen fark hesabı kapalı.
              </div>
            </div>
          </div>
        </td>
      `;
      t.appendChild(trTop);

      // POZ cards
      for (const art of costState.pozList){
        ensurePoz(art);
        const poz = dqeByArt.get(String(art).trim()) || null;
        const t = pozTotals(art);
        const pconf = costState.poz[art];

        const pozVal = poz ? (poz[costState.pozCol] ?? null) : null;
        const um = poz?.um ? String(poz.um).trim() : "";
        const umWarn = (um && um.toLowerCase() !== "m3") ? `<span class="warn">UM ≠ m3 (${esc(um)})</span>` : "";

        let diffTxt = "-";
        if (costState.pozCol !== "euro" && pozVal != null && Number(pozVal) !== 0){
          const diff = Number(pozVal) - t.unit;
          const diffPct = (diff / Number(pozVal)) * 100;
          diffTxt = `${fmt(diff)} (${fmt(diffPct)}%)`;
        }

        const machineOptions = machineTemplates.map(m => `<option value="${m.idx}">${esc(m.cinsi)}</option>`).join("");
        const laborOptions   = laborTemplates.map(l => `<option value="${l.idx}">${esc(l.grup)} - ${esc(l.pozisyon)}</option>`).join("");

        const machineRows = pconf.machines.map(m => `
          <div class="rowLine" data-art="${esc(art)}" data-type="m" data-id="${esc(m.id)}">
            <input data-f="name" type="text" value="${esc(m.name)}">
            <input data-f="um" type="text" value="${esc(m.um)}">
            <input data-f="miktar" type="number" step="0.01" value="${esc(m.miktar)}">
            <input data-f="adet" type="number" step="0.01" value="${esc(m.adet)}">
            <input data-f="birimFiyatDzd" type="number" step="0.01" value="${esc(m.birimFiyatDzd)}">
            <button class="xbtn" type="button" data-act="removeLine" data-art="${esc(art)}" data-ltype="m" data-id="${esc(m.id)}">×</button>
          </div>
          <div class="lineTotal">Tutar: <b data-total="${esc(art)}|m|${esc(m.id)}">${fmt(machineLineTotal(m))} DZD</b></div>
        `).join("");

        const laborRows = pconf.labor.map(l => {
          const label = `${l.grup} - ${l.pozisyon}`;
          return `
            <div class="rowLine" data-art="${esc(art)}" data-type="l" data-id="${esc(l.id)}">
              <input data-f="label" type="text" value="${esc(label)}">
              <input data-f="um" type="text" value="${esc(l.um)}">
              <input data-f="saat" type="number" step="0.01" value="${esc(l.saat)}">
              <input data-f="adet" type="number" step="0.01" value="${esc(l.adet)}">
              <input data-f="birimSaatDzd" type="number" step="0.01" value="${esc(l.birimSaatDzd)}">
              <button class="xbtn" type="button" data-act="removeLine" data-art="${esc(art)}" data-ltype="l" data-id="${esc(l.id)}">×</button>
            </div>
            <div class="lineTotal">Tutar: <b data-total="${esc(art)}|l|${esc(l.id)}">${fmt(laborLineTotal(l))} DZD</b></div>
          `;
        }).join("");

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td colspan="6">
            <div class="pozCard" data-poz="${esc(art)}">
              <div class="pozTop">
                <div>
                  <div class="art" style="font-size:14px;">${esc(art)}</div>
                  <div class="desc">${poz ? esc(poz.description) : "<span class='warn'>DQE’de yok</span>"} ${umWarn}</div>
                </div>

                <div class="right">
                  <span class="badge">POZ: ${pozVal!=null?fmt(pozVal):"-"} ${costState.pozCol==="euro"?"€":"DZD"}</span>
                  <span class="badge">Makina: <b data-sub="${esc(art)}|m">${fmt(t.m)}</b> DZD</span>
                  <span class="badge">İşçilik: <b data-sub="${esc(art)}|l">${fmt(t.l)}</b> DZD</span>
                  <span class="badge">Toplam: <b data-poz-total="${esc(art)}">${fmt(t.total)}</b> DZD</span>
                  <span class="badge">Birim: <b data-poz-unit="${esc(art)}">${fmt(t.unit)}</b></span>
                  <span class="badge">Fark: <b data-poz-diff="${esc(art)}">${diffTxt}</b></span>
                </div>
              </div>

              <div class="pozActions">
                <span class="mini">Üretim (bu POZ için):</span>
                <input class="inputSmall" data-act="setProduction" data-art="${esc(art)}" type="number" step="0.01" value="${esc(pconf.production)}">
                <span class="mini">(Birim maliyet = toplam / üretim)</span>
                <button class="btn" type="button" data-act="removePoz" data-art="${esc(art)}">Bu POZ’u çıkar</button>
              </div>

              <div class="twoCols">
                <div class="box">
                  <div class="boxTitle">
                    <span>MAKİNA</span>
                    <span class="badge">Subtotal: <b data-sub="${esc(art)}|m">${fmt(t.m)}</b> DZD</span>
                  </div>
                  <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:10px;">
                    <select class="select" data-act="addMachineSelect" data-art="${esc(art)}">
                      <option value="">Makina seç...</option>
                      ${machineOptions}
                    </select>
                    <button class="btn primary" type="button" data-act="addMachineBtn" data-art="${esc(art)}">Ekle</button>
                  </div>

                  <div class="rowHead">
                    <div>Cinsi</div><div>UM</div><div>Miktar</div><div>Adet</div><div>Birim Fiyat</div><div></div>
                  </div>
                  <div data-list="${esc(art)}|m">
                    ${machineRows || `<div class="mini">Henüz makina eklemedin.</div>`}
                  </div>
                </div>

                <div class="box">
                  <div class="boxTitle">
                    <span>İŞÇİLİK</span>
                    <span class="badge">Subtotal: <b data-sub="${esc(art)}|l">${fmt(t.l)}</b> DZD</span>
                  </div>
                  <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:10px;">
                    <select class="select" data-act="addLaborSelect" data-art="${esc(art)}">
                      <option value="">İşçilik seç...</option>
                      ${laborOptions}
                    </select>
                    <button class="btn primary" type="button" data-act="addLaborBtn" data-art="${esc(art)}">Ekle</button>
                  </div>

                  <div class="rowHead">
                    <div>Grup - Pozisyon</div><div>UM</div><div>Saat</div><div>Adet</div><div>Birim Saat</div><div></div>
                  </div>
                  <div data-list="${esc(art)}|l">
                    ${laborRows || `<div class="mini">Henüz işçilik eklemedin.</div>`}
                  </div>
                </div>
              </div>
            </div>
          </td>
        `;
        t.appendChild(tr);
      }

      countEl.textContent = `POZ: ${costState.pozList.length}`;
    }

    // Live UI updates (typing doesn't rerender)
    function updatePozUI(art){
      const t = pozTotals(art);

      const subM = document.querySelector(`[data-sub="${CSS.escape(art)}|m"]`);
      const subL = document.querySelector(`[data-sub="${CSS.escape(art)}|l"]`);
      const totalEl = document.querySelector(`[data-poz-total="${CSS.escape(art)}"]`);
      const unitEl  = document.querySelector(`[data-poz-unit="${CSS.escape(art)}"]`);

      if (subM) subM.textContent = fmt(t.m);
      if (subL) subL.textContent = fmt(t.l);
      if (totalEl) totalEl.textContent = fmt(t.total);
      if (unitEl) unitEl.textContent = fmt(t.unit);

      const poz = dqeByArt.get(String(art).trim()) || null;
      const pozVal = poz ? (poz[costState.pozCol] ?? null) : null;

      const diffEl = document.querySelector(`[data-poz-diff="${CSS.escape(art)}"]`);
      if (diffEl){
        if (costState.pozCol === "euro" || pozVal == null || Number(pozVal) === 0){
          diffEl.textContent = "-";
        } else {
          const diff = Number(pozVal) - t.unit;
          const diffPct = (diff / Number(pozVal)) * 100;
          diffEl.textContent = `${fmt(diff)} (${fmt(diffPct)}%)`;
        }
      }

      const p = ensurePoz(art);
      for (const m of p.machines){
        const el = document.querySelector(`[data-total="${CSS.escape(art)}|m|${CSS.escape(m.id)}"]`);
        if (el) el.textContent = `${fmt(machineLineTotal(m))} DZD`;
      }
      for (const l of p.labor){
        const el = document.querySelector(`[data-total="${CSS.escape(art)}|l|${CSS.escape(l.id)}"]`);
        if (el) el.textContent = `${fmt(laborLineTotal(l))} DZD`;
      }

      let grandTotal = 0;
      for (const a of costState.pozList) grandTotal += pozTotals(a).total;
      gtDzd.textContent = `${fmt(grandTotal)} DZD`;
      grandChip.textContent = `POZ toplamları: ${fmt(grandTotal)} DZD`;
    }

    function render(){
      if (currentView === "dqe"){
        expandAllBtn.disabled = false;
        collapseAllBtn.disabled = false;
        sortArtEl.disabled = false;
        renderDQE();
      } else {
        renderCOST();
      }
    }

    // Top events
    clearBtn.addEventListener("click", ()=>{ q.value=""; render(); q.focus(); });
    q.addEventListener("input", ()=>render());
    viewSel.addEventListener("change", ()=>{ currentView=viewSel.value; render(); });

    expandAllBtn.addEventListener("click", ()=>{ for (const g of dqeGroups) g.collapsed=false; render(); });
    collapseAllBtn.addEventListener("click", ()=>{ for (const g of dqeGroups) g.collapsed=true; render(); });
    sortArtEl.addEventListener("change", render);

    // DQE collapse
    t.addEventListener("click", (e)=>{
      if (currentView !== "dqe") return;
      const btn = e.target.closest("[data-gid]");
      if (!btn) return;
      if (q.value.trim()) return;
      const gid = btn.getAttribute("data-gid");
      const g = dqeGroups.find(x=>x.id===gid);
      if (!g) return;
      g.collapsed = !g.collapsed;
      render();
    });

    // COST actions (delegated)
    t.addEventListener("click", (e)=>{
      if (currentView !== "cost") return;
      const el = e.target.closest("[data-act]");
      if (!el) return;
      const act = el.getAttribute("data-act");

      if (act === "addPoz"){
        const input = document.getElementById("pozPick");
        const art = (input?.value||"").trim();
        addPoz(art);
        if (input) input.value="";
        render();
      }
      if (act === "clearPoz"){ clearPozList(); render(); }
      if (act === "removePoz"){
        const art = el.getAttribute("data-art");
        removePoz(art);
        render();
      }
      if (act === "addMachineBtn"){
        const art = el.getAttribute("data-art");
        const sel = document.querySelector(`select[data-act="addMachineSelect"][data-art="${CSS.escape(art)}"]`);
        const v = sel?.value;
        if (v !== ""){
          addMachineLine(art, v);
          if (sel) sel.value="";
          render();
        }
      }
      if (act === "addLaborBtn"){
        const art = el.getAttribute("data-art");
        const sel = document.querySelector(`select[data-act="addLaborSelect"][data-art="${CSS.escape(art)}"]`);
        const v = sel?.value;
        if (v !== ""){
          addLaborLine(art, v);
          if (sel) sel.value="";
          render();
        }
      }
      if (act === "removeLine"){
        const art = el.getAttribute("data-art");
        const ltype = el.getAttribute("data-ltype");
        const id = el.getAttribute("data-id");
        removeLine(art, ltype, id);
        render();
      }
    });

    // COST inputs (no rerender while typing)
    t.addEventListener("input", (e)=>{
      if (currentView !== "cost") return;
      const inp = e.target.closest("input");
      if (!inp) return;

      const act = inp.getAttribute("data-act");

      if (act === "setUnit"){
        const k = inp.getAttribute("data-k");
        costState.unitPanel[k] = Number(inp.value);
        saveCostState();
        return;
      }

      if (act === "setProduction"){
        const art = inp.getAttribute("data-art");
        const p = ensurePoz(art);
        p.production = Number(inp.value);
        saveCostState();
        updatePozUI(art);
        return;
      }

      const lineWrap = inp.closest(".rowLine");
      if (!lineWrap) return;

      const art = lineWrap.getAttribute("data-art");
      const type = lineWrap.getAttribute("data-type");
      const id = lineWrap.getAttribute("data-id");
      const field = inp.getAttribute("data-f");
      const p = ensurePoz(art);

      if (type === "m"){
        const line = p.machines.find(x=>x.id===id);
        if (!line) return;
        if (field === "name" || field === "um") line[field] = inp.value;
        else line[field] = Number(inp.value);
        saveCostState();
        updatePozUI(art);
      }

      if (type === "l"){
        const line = p.labor.find(x=>x.id===id);
        if (!line) return;

        if (field === "label"){
          const txt = inp.value;
          const parts = txt.split("-").map(s=>s.trim());
          line.grup = parts[0] || line.grup;
          line.pozisyon = parts.slice(1).join(" - ") || line.pozisyon;
        } else if (field === "um"){
          line.um = inp.value;
        } else {
          line[field] = Number(inp.value);
        }
        saveCostState();
        updatePozUI(art);
      }
    });

    // blur: after unit panel editing rerender to update km etc
    t.addEventListener("blur", (e)=>{
      if (currentView !== "cost") return;
      const inp = e.target.closest('input[data-act="setUnit"]');
      if (!inp) return;
      render();
    }, true);

    // pozCol change
    t.addEventListener("change", (e)=>{
      if (currentView !== "cost") return;
      const sel = e.target.closest('select[data-act="setPozCol"]');
      if (!sel) return;
      costState.pozCol = sel.value;
      saveCostState();
      render();
    });

    render();
  </script>
</>
</html>
