<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MASTER DQE</title>
  <style>
    body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial; background:#f4f6f8; margin:0; padding:16px; color:#222; }
    .wrap { max-width: 1200px; margin: 0 auto; background:#fff; border:1px solid #e5e7eb; border-radius:16px; padding:16px; box-shadow:0 10px 30px rgba(0,0,0,.05); }
    h1 { margin:0 0 12px; font-size:20px; }

    .toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin: 10px 0 14px; }
    input[type="text"] { padding:10px 12px; border:1px solid #d1d5db; border-radius:10px; min-width:320px; }
    select, .btn { padding:10px 12px; border:1px solid #d1d5db; background:#fff; border-radius:10px; cursor:pointer; }
    .btn:hover, select:hover { background:#f9fafb; }
    .chip { padding:8px 10px; border:1px solid #e5e7eb; border-radius:999px; background:#f9fafb; font-size:12px; color:#374151; }
    label { display:flex; gap:8px; align-items:center; user-select:none; }
    .muted { color:#6b7280; }

    table { width:100%; border-collapse: collapse; font-size: 13px; }
    thead th { position: sticky; top: 0; background:#f9fafb; border-bottom:1px solid #e5e7eb; padding:10px; text-align:left; z-index:2; }
    tbody td, tfoot td { border-bottom:1px solid #eef2f7; padding:10px; vertical-align: top; }
    tbody tr:hover td { background:#fcfcfd; }

    .num { text-align:right; white-space:nowrap; font-variant-numeric: tabular-nums; }
    .art { white-space:nowrap; font-weight:600; }
    mark { padding:0 2px; border-radius:4px; background:#ffe08a; }

    .serie td { background:#fff7d6; font-weight:800; border-bottom:1px solid #f1e3a6; }
    .subsection td { background:#fff2bf; font-weight:700; border-bottom:1px solid #f1e3a6; }
    .subtotal td { background:#f3f4f6; font-weight:700; }

    tfoot td { background:#111827; color:#fff; font-weight:800; border-bottom:none; }

    .toggle { display:flex; align-items:center; gap:10px; }
    .caret {
      width:18px; height:18px; display:inline-flex; align-items:center; justify-content:center;
      border:1px solid #e5e7eb; border-radius:6px; background:#fff; font-size:12px;
    }
    .right { margin-left:auto; display:flex; gap:8px; align-items:center; }
    .badge { font-size:12px; padding:3px 8px; border-radius:999px; border:1px solid #e5e7eb; background:#fff; }

    /* COST UI */
    .panelBox{ display:flex; gap:16px; flex-wrap:wrap; align-items:flex-start; }
    .panelGrid{ display:grid; grid-template-columns: 190px 160px; gap:8px 10px; align-items:center; }
    .panelGrid input, .panelGrid select{
      padding:8px; border:1px solid #d1d5db; border-radius:10px; background:#fff;
    }

    .card {
      border:1px solid #e5e7eb; border-radius:14px; padding:12px;
      background:#fff; min-width: 380px;
    }
    .card h3 { margin:0 0 8px; font-size:13px; }

    .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
    .chipItem {
      display:inline-flex; align-items:center; gap:8px;
      border:1px solid #e5e7eb; background:#f9fafb; border-radius:999px;
      padding:6px 10px; font-size:12px;
    }
    .chipItem button{
      border:none; background:transparent; cursor:pointer; font-weight:900; line-height:1;
    }

    .pozCard{
      border:1px solid #e5e7eb; border-radius:14px; padding:12px; background:#fff;
      margin-top:10px;
    }
    .pozHeader{
      display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    }
    .pozHeader .title{ font-weight:900; }
    .pozHeader .mini{ font-size:12px; color:#6b7280; }
    .pozHeader .rightSide{ margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }

    .grid2{
      display:grid; grid-template-columns: 1fr 1fr; gap:10px;
      margin-top:10px;
    }
    .box{
      border:1px solid #eef2f7; border-radius:12px; padding:10px; background:#fcfcfd;
    }
    .boxTitle{ font-weight:800; margin-bottom:6px; }
    .rowLine{
      display:grid;
      grid-template-columns: 1.6fr 0.6fr 0.6fr 0.9fr 0.9fr 40px;
      gap:6px; align-items:center;
      margin:6px 0;
      font-size:12px;
    }
    .rowLine input{
      width:100%; padding:6px 8px; border:1px solid #d1d5db; border-radius:10px; background:#fff;
      font-size:12px;
    }
    .rowLine .xbtn{
      border:1px solid #e5e7eb; border-radius:10px; background:#fff; cursor:pointer;
      height:30px;
    }
    .rowHead{
      display:grid;
      grid-template-columns: 1.6fr 0.6fr 0.6fr 0.9fr 0.9fr 40px;
      gap:6px; font-size:11px; color:#6b7280; margin-top:6px;
    }
    .warn { color:#b45309; font-weight:800; }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>MASTER DQE</h1>

    <div class="toolbar">
      <select id="viewSel">
        <option value="dqe">DQE</option>
        <option value="cost">Makina & İşçilik</option>
      </select>

      <input id="q" type="text" placeholder="Hızlı filtre (ART / açıklama / UM / fiyat)…" />
      <button class="btn" id="clearBtn">Temizle</button>

      <button class="btn" id="expandAll">Tümünü Aç</button>
      <button class="btn" id="collapseAll">Tümünü Kapat</button>

      <label class="chip" title="DQE ekranında: ART’a göre sıralama (her alt başlık içinde)">
        <input type="checkbox" id="sortArt" />
        ART’a göre sırala
      </label>

      <span class="chip" id="count"></span>
      <span class="chip" id="grandChip"></span>
    </div>

    <table>
      <thead>
        <tr>
          <th style="width:140px">ART</th>
          <th>DESCRIPTION</th>
          <th style="width:90px">UM</th>
          <th class="num" style="width:170px">DZD</th>
          <th class="num" style="width:140px">Euro</th>
          <th class="num" style="width:190px">DZDéqv</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
      <tfoot>
        <tr>
          <td colspan="3">GRAND TOTAL</td>
          <td class="num" id="gtDzd"></td>
          <td class="num" id="gtEuro"></td>
          <td class="num" id="gtEqv"></td>
        </tr>
      </tfoot>
    </table>

    <datalist id="dqeArtList"></datalist>

    <p class="muted" style="margin:10px 0 0;">
      Filtre açıkken eşleşen satırlar highlight olur. DQE’de filtre açıkken seriler otomatik açık görünür.
    </p>
  </div>

  <script type="module">
    import { dqe, costSheets } from "./database.js";

    const tbody = document.getElementById("tbody");
    const q = document.getElementById("q");
    const clearBtn = document.getElementById("clearBtn");
    const expandAllBtn = document.getElementById("expandAll");
    const collapseAllBtn = document.getElementById("collapseAll");
    const sortArtEl = document.getElementById("sortArt");
    const countEl = document.getElementById("count");
    const grandChip = document.getElementById("grandChip");
    const viewSel = document.getElementById("viewSel");

    const gtDzd = document.getElementById("gtDzd");
    const gtEuro = document.getElementById("gtEuro");
    const gtEqv = document.getElementById("gtEqv");

    const dqeArtList = document.getElementById("dqeArtList");

    let currentView = "dqe";
    const sheet = costSheets[0]; // şimdilik tek sheet

    // -----------------------
    // Formatting helpers
    // -----------------------
    const fmt = (v) => {
      if (v === null || v === undefined || Number.isNaN(Number(v))) return "-";
      return new Intl.NumberFormat("tr-TR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(Number(v));
    };

    function esc(s) {
      return (s ?? "").toString()
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function highlight(text, needle) {
      const t = (text ?? "").toString();
      if (!needle) return esc(t);
      const n = needle.toLowerCase();
      const idx = t.toLowerCase().indexOf(n);
      if (idx === -1) return esc(t);
      const before = t.slice(0, idx);
      const mid = t.slice(idx, idx + needle.length);
      const after = t.slice(idx + needle.length);
      return `${esc(before)}<mark>${esc(mid)}</mark>${esc(after)}`;
    }

    // ART compare (A2.10 > A2.2)
    function artKey(art) {
      const s = (art || "").trim();
      const m = s.match(/^([A-Za-z]+)\s*(.*)$/);
      const letters = (m?.[1] || "").toUpperCase();
      const rest = (m?.[2] || "").replace(/[^\d.]/g, "");
      const nums = rest ? rest.split(".").filter(Boolean).map(n => parseInt(n, 10)) : [];
      return { letters, nums };
    }
    function cmpArt(a, b) {
      const ka = artKey(a), kb = artKey(b);
      if (ka.letters !== kb.letters) return ka.letters < kb.letters ? -1 : 1;
      const len = Math.max(ka.nums.length, kb.nums.length);
      for (let i = 0; i < len; i++) {
        const na = ka.nums[i] ?? -1;
        const nb = kb.nums[i] ?? -1;
        if (na !== nb) return na - nb;
      }
      return 0;
    }

    // -----------------------
    // DQE data lookup
    // -----------------------
    const dqeRows = dqe.filter(x => x.type === "row");
    const dqeByArt = new Map(dqeRows.map(r => [String(r.art).trim(), r]));

    function fillDatalist() {
      dqeArtList.innerHTML = "";
      const rowsSorted = [...dqeRows].sort((a,b)=>cmpArt(a.art,b.art));
      for (const r of rowsSorted) {
        const opt = document.createElement("option");
        opt.value = r.art;
        opt.label = `${r.art} — ${r.description}`;
        dqeArtList.appendChild(opt);
      }
    }
    fillDatalist();

    // -----------------------
    // DQE grouping (collapse)
    // -----------------------
    function buildGroups(items) {
      const groups = [];
      let current = null;

      const startGroup = (sectionItem) => {
        const id = `g_${groups.length}_${(sectionItem.label || "").slice(0,20).replace(/\s+/g,"_")}`;
        current = { id, header: sectionItem, collapsed: false, blocks: [] };
        groups.push(current);
      };

      const ensureBlock = (subHeader = null) => {
        if (!current) startGroup({ type:"section", level:1, label:"(NO SERIE)" });
        const last = current.blocks[current.blocks.length - 1];
        if (!last || last.subHeader !== subHeader) current.blocks.push({ subHeader, items: [] });
        return current.blocks[current.blocks.length - 1];
      };

      for (const it of items) {
        if (it.type === "section" && it.level === 1) { startGroup(it); continue; }
        if (it.type === "section" && it.level === 2) { ensureBlock(it); continue; }
        ensureBlock(current?.blocks?.length ? current.blocks[current.blocks.length - 1].subHeader : null).items.push(it);
      }
      return groups;
    }
    const dqeGroups = buildGroups(dqe);

    const sumCol = (rows, key) => rows.reduce((acc, r) => acc + (Number(r?.[key]) || 0), 0);
    function groupAllRows(g) {
      const rows = [];
      for (const b of g.blocks) for (const it of b.items) if (it.type === "row") rows.push(it);
      return rows;
    }
    function searchableRowText(r) {
      const parts = [r.art, r.description, r.um, r.dzd, r.euro, r.dzdEqv, fmt(r.dzd), fmt(r.euro), fmt(r.dzdEqv)];
      return parts.map(x => (x ?? "").toString().toLowerCase()).join(" | ");
    }

    // -----------------------
    // COST state (multi poz + lines)
    // -----------------------
    const LS_STATE = "cost_state_v2";
    const defaultState = () => ({
      pozCol: "dzdEqv",          // dzd | dzdEqv | euro
      pozList: [],              // ["C3.1", "C4.3"]
      unitPanel: {              // editable
        daily_excavation_m3: sheet.unitPanel?.daily_excavation_m3 ?? 2700,
        trip_km_loaded_empty: sheet.unitPanel?.trip_km_loaded_empty ?? 10,
        bucket_volume_m3: sheet.unitPanel?.bucket_volume_m3 ?? 9,
        trip_count: sheet.unitPanel?.trip_count ?? 15
      },
      poz: {                    // per-poz config
        // "C3.1": { production: 2700, machines: [...], labor:[...] }
      }
    });

    let costState = (() => {
      try {
        const raw = localStorage.getItem(LS_STATE);
        if (!raw) return defaultState();
        const obj = JSON.parse(raw);
        // simple guard
        if (!obj || typeof obj !== "object") return defaultState();
        obj.pozList = Array.isArray(obj.pozList) ? obj.pozList : [];
        obj.poz = obj.poz && typeof obj.poz === "object" ? obj.poz : {};
        obj.unitPanel = obj.unitPanel && typeof obj.unitPanel === "object" ? obj.unitPanel : defaultState().unitPanel;
        obj.pozCol = obj.pozCol || "dzdEqv";
        return obj;
      } catch { return defaultState(); }
    })();

    function saveCostState() {
      localStorage.setItem(LS_STATE, JSON.stringify(costState));
    }

    function ensurePoz(art) {
      const a = String(art || "").trim();
      if (!a) return null;
      if (!costState.poz[a]) {
        costState.poz[a] = {
          production: Number(costState.unitPanel.daily_excavation_m3 || 0),
          machines: [],
          labor: []
        };
      }
      return costState.poz[a];
    }

    function addPoz(art) {
      const a = String(art || "").trim();
      if (!a) return;
      if (!costState.pozList.includes(a)) {
        costState.pozList.push(a);
        costState.pozList.sort((x,y)=>cmpArt(x,y));
        ensurePoz(a);
        saveCostState();
      }
    }

    function removePoz(art) {
      const a = String(art || "").trim();
      costState.pozList = costState.pozList.filter(x => x !== a);
      // poz detayını silmiyoruz (istersen sileriz)
      saveCostState();
    }

    function clearPozList() {
      costState.pozList = [];
      saveCostState();
    }

    // template lists
    const machineTemplates = sheet.makina.map((m, idx) => ({ idx, ...m }));
    const laborTemplates = sheet.iscilik.map((l, idx) => ({ idx, ...l }));

    function makeId() {
      return "id_" + Math.random().toString(16).slice(2) + "_" + Date.now().toString(16);
    }

    function addMachineLine(pozArt, templateIdx) {
      const p = ensurePoz(pozArt);
      if (!p) return;
      const t = machineTemplates.find(x => x.idx === Number(templateIdx));
      if (!t) return;
      p.machines.push({
        id: makeId(),
        name: t.cinsi,
        um: t.um,
        miktar: Number(t.miktar),
        adet: Number(t.adet),
        birimFiyatDzd: Number(t.birimFiyatDzd)
      });
      saveCostState();
    }

    function addLaborLine(pozArt, templateIdx) {
      const p = ensurePoz(pozArt);
      if (!p) return;
      const t = laborTemplates.find(x => x.idx === Number(templateIdx));
      if (!t) return;
      p.labor.push({
        id: makeId(),
        grup: t.grup,
        pozisyon: t.pozisyon,
        um: t.um,
        saat: Number(t.saat),
        adet: Number(t.adet),
        birimSaatDzd: Number(t.birimSaatDzd),
        maasDzd: Number(t.maasDzd)
      });
      saveCostState();
    }

    function removeLine(pozArt, type, id) {
      const p = ensurePoz(pozArt);
      if (!p) return;
      if (type === "m") p.machines = p.machines.filter(x => x.id !== id);
      if (type === "l") p.labor = p.labor.filter(x => x.id !== id);
      saveCostState();
    }

    function machineLineTotal(x) {
      return Number(x.miktar||0) * Number(x.adet||0) * Number(x.birimFiyatDzd||0);
    }
    function laborLineTotal(x) {
      return Number(x.saat||0) * Number(x.adet||0) * Number(x.birimSaatDzd||0);
    }

    function pozTotals(pozArt) {
      const p = ensurePoz(pozArt);
      const m = p.machines.reduce((a,x)=>a + machineLineTotal(x), 0);
      const l = p.labor.reduce((a,x)=>a + laborLineTotal(x), 0);
      const total = m + l;
      const prod = Number(p.production || 0);
      const unit = prod > 0 ? (total / prod) : 0;
      return { m, l, total, prod, unit };
    }

    // -----------------------
    // Render DQE view
    // -----------------------
    function renderDQE() {
      const needle = q.value.trim();
      const needleLower = needle.toLowerCase();
      const sortArt = sortArtEl.checked;

      const allRows = dqeRows;
      const gtd = sumCol(allRows, "dzd");
      const gte = sumCol(allRows, "euro");
      const gtq = sumCol(allRows, "dzdEqv");

      gtDzd.textContent = `${fmt(gtd)} DZD`;
      gtEuro.textContent = `${fmt(gte)} €`;
      gtEqv.textContent = `${fmt(gtq)} DZD`;
      grandChip.textContent = `Grand: ${fmt(gtd)} DZD | ${fmt(gte)} € | ${fmt(gtq)} DZD`;

      tbody.innerHTML = "";
      let visibleRowCount = 0;

      for (const g of dqeGroups) {
        const headerLabel = g.header?.label ?? "";

        let groupMatches = false;
        const matchedRowsByBlock = new Map();

        if (needle) {
          if (headerLabel.toLowerCase().includes(needleLower)) groupMatches = true;

          for (const b of g.blocks) {
            const matched = b.items.filter(it => it.type === "row" && searchableRowText(it).includes(needleLower));
            if (matched.length) { groupMatches = true; matchedRowsByBlock.set(b, matched); }
          }
          if (!groupMatches) continue;
        }

        const collapsed = needle ? false : g.collapsed;

        const trH = document.createElement("tr");
        trH.className = "serie";
        const tdH = document.createElement("td");
        tdH.colSpan = 6;

        const gRows = groupAllRows(g);
        const subDzd = sumCol(gRows, "dzd");
        const subEuro = sumCol(gRows, "euro");
        const subEqv = sumCol(gRows, "dzdEqv");

        tdH.innerHTML = `
          <div class="toggle" role="button" tabindex="0" data-gid="${g.id}">
            <span class="caret">${collapsed ? "▶" : "▼"}</span>
            <span>${highlight(headerLabel, needle)}</span>
            <span class="right">
              <span class="badge">${fmt(subDzd)} DZD | ${fmt(subEuro)} €</span>
            </span>
          </div>
        `;
        trH.appendChild(tdH);
        tbody.appendChild(trH);

        if (collapsed) continue;

        for (const b of g.blocks) {
          const subHeader = b.subHeader;

          let rowsToRender = b.items.filter(it => it.type === "row");
          if (needle) {
            rowsToRender = matchedRowsByBlock.get(b) ?? [];
            if (!rowsToRender.length) continue;
          }

          if (sortArt) rowsToRender = [...rowsToRender].sort((x, y) => cmpArt(x.art, y.art));

          if (subHeader) {
            const trS = document.createElement("tr");
            trS.className = "subsection";
            const tdS = document.createElement("td");
            tdS.colSpan = 6;
            tdS.innerHTML = highlight(subHeader.label, needle);
            trS.appendChild(tdS);
            tbody.appendChild(trS);
          }

          for (const r of rowsToRender) {
            const tr = document.createElement("tr");

            tr.innerHTML = `
              <td class="art">${highlight(r.art ?? "", needle)}</td>
              <td>${highlight(r.description ?? "", needle)}</td>
              <td>${highlight(r.um ?? "", needle)}</td>
              <td class="num">${highlight(r.dzd != null ? `${fmt(r.dzd)} DZD` : "-", needle)}</td>
              <td class="num">${highlight(r.euro != null ? `${fmt(r.euro)} €` : "- €", needle)}</td>
              <td class="num">${highlight(r.dzdEqv != null ? `${fmt(r.dzdEqv)} DZD` : "-", needle)}</td>
            `;
            tbody.appendChild(tr);
            visibleRowCount++;
          }
        }

        if (!needle) {
          const trSub = document.createElement("tr");
          trSub.className = "subtotal";
          trSub.innerHTML = `
            <td colspan="3">SUBTOTAL (SERIE)</td>
            <td class="num">${fmt(subDzd)} DZD</td>
            <td class="num">${fmt(subEuro)} €</td>
            <td class="num">${fmt(subEqv)} DZD</td>
          `;
          tbody.appendChild(trSub);
        }
      }

      countEl.textContent = `${visibleRowCount} satır`;
    }

    // -----------------------
    // Render COST view (poz + dropdown lines)
    // -----------------------
    function renderCOST() {
      expandAllBtn.disabled = true;
      collapseAllBtn.disabled = true;
      sortArtEl.disabled = true;

      tbody.innerHTML = "";

      // header / summary for cost view
      const p = costState.unitPanel;
      const totalKm = Number(p.trip_km_loaded_empty||0) * Number(p.trip_count||0);

      // grand summary across selected poz (optional)
      let grandTotal = 0;
      for (const a of costState.pozList) grandTotal += pozTotals(a).total;

      gtDzd.textContent = `${fmt(grandTotal)} DZD`;
      gtEuro.textContent = `-`;
      gtEqv.textContent = `-`;
      grandChip.textContent = `POZ toplamları: ${fmt(grandTotal)} DZD`;

      // Top panel row
      const trTop = document.createElement("tr");
      trTop.className = "serie";
      const tdTop = document.createElement("td");
      tdTop.colSpan = 6;

      const chipsHtml = costState.pozList.length
        ? `<div class="chips">
            ${costState.pozList.map(a => `
              <span class="chipItem">
                ${esc(a)}
                <button type="button" data-act="removePoz" data-art="${esc(a)}" title="Çıkar">×</button>
              </span>
            `).join("")}
          </div>`
        : `<div class="muted" style="margin-top:6px;">Henüz POZ eklemedin.</div>`;

      tdTop.innerHTML = `
        <div class="panelBox">
          <div style="font-weight:900;">ÖLÇÜ BİRİMİ (Global)</div>

          <div class="panelGrid">
            <div>günlük kazı (m³)</div>
            <input data-act="setUnit" data-k="daily_excavation_m3" type="number" step="1" value="${esc(p.daily_excavation_m3)}" />

            <div>sefer (dolu+boş) /km</div>
            <input data-act="setUnit" data-k="trip_km_loaded_empty" type="number" step="0.1" value="${esc(p.trip_km_loaded_empty)}" />

            <div>kasa hacim (m³)</div>
            <input data-act="setUnit" data-k="bucket_volume_m3" type="number" step="0.1" value="${esc(p.bucket_volume_m3)}" />

            <div>sefer adet</div>
            <input data-act="setUnit" data-k="trip_count" type="number" step="1" value="${esc(p.trip_count)}" />

            <div style="font-weight:800;">toplam km</div>
            <div style="font-weight:900;">${fmt(totalKm)} km</div>
          </div>

          <div class="card">
            <h3>POZ menü: seç → Ekle → listeden çıkar</h3>
            <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
              <input id="pozPick" list="dqeArtList" placeholder="ART seç (örn C3.1)" value=""
                     style="padding:8px;border:1px solid #d1d5db;border-radius:10px; min-width:170px;" />
              <button class="btn" data-act="addPoz" type="button">Ekle</button>
              <button class="btn" data-act="clearPoz" type="button">Listeyi temizle</button>

              <select data-act="setPozCol" style="padding:8px;border:1px solid #d1d5db;border-radius:10px;">
                <option value="dzd" ${costState.pozCol==="dzd"?"selected":""}>POZ fiyat: DZD</option>
                <option value="dzdEqv" ${costState.pozCol==="dzdEqv"?"selected":""}>POZ fiyat: DZDéqv</option>
                <option value="euro" ${costState.pozCol==="euro"?"selected":""}>POZ fiyat: Euro</option>
              </select>
            </div>

            ${chipsHtml}
            <div class="muted" style="margin-top:8px;">
              POZ kartlarının içinde Makina/İşçilik dropdown’dan satır ekleyip manuel düzenle.
            </div>
          </div>

          <div style="margin-left:auto; display:flex; gap:10px; flex-wrap:wrap;">
            <span class="badge">Seçili POZ: ${costState.pozList.length}</span>
            <span class="badge">Toplam: ${fmt(grandTotal)} DZD</span>
          </div>
        </div>
      `;

      trTop.appendChild(tdTop);
      tbody.appendChild(trTop);

      // Poz cards
      for (const art of costState.pozList) {
        ensurePoz(art);
        const poz = dqeByArt.get(String(art).trim()) || null;
        const t = pozTotals(art);

        const pozVal = poz ? (poz[costState.pozCol] ?? null) : null;

        const um = poz?.um ? String(poz.um).trim() : "";
        const umWarn = (um && um.toLowerCase() !== "m3") ? `<span class="warn">UM ≠ m3 (${esc(um)})</span>` : "";

        let diff = null, diffPct = null;
        if (costState.pozCol !== "euro" && pozVal != null && Number(pozVal) !== 0) {
          diff = Number(pozVal) - t.unit;
          diffPct = (diff / Number(pozVal)) * 100;
        }

        const machineOptions = machineTemplates.map(m => `<option value="${m.idx}">${esc(m.cinsi)}</option>`).join("");
        const laborOptions = laborTemplates.map(l => `<option value="${l.idx}">${esc(l.grup)} - ${esc(l.pozisyon)}</option>`).join("");

        const pconf = costState.poz[art];

        const machineRows = pconf.machines.map((m) => {
          const total = machineLineTotal(m);
          return `
            <div class="rowLine" data-art="${esc(art)}" data-type="m" data-id="${esc(m.id)}">
              <div><input data-f="name" type="text" value="${esc(m.name)}" /></div>
              <div><input data-f="um" type="text" value="${esc(m.um)}" /></div>
              <div><input data-f="miktar" type="number" step="0.01" value="${esc(m.miktar)}" /></div>
              <div><input data-f="adet" type="number" step="0.01" value="${esc(m.adet)}" /></div>
              <div><input data-f="birimFiyatDzd" type="number" step="0.01" value="${esc(m.birimFiyatDzd)}" /></div>
              <button class="xbtn" type="button" data-act="removeLine" data-art="${esc(art)}" data-ltype="m" data-id="${esc(m.id)}">×</button>
            </div>
            <div class="muted" style="margin:-2px 0 8px 0; font-size:11px;">
              Tutar: <b data-total="${esc(art)}|m|${esc(m.id)}">${fmt(total)} DZD</b>
            </div>
          `;
        }).join("");

        const laborRows = pconf.labor.map((l) => {
          const total = laborLineTotal(l);
          const label = `${l.grup} - ${l.pozisyon}`;
          return `
            <div class="rowLine" data-art="${esc(art)}" data-type="l" data-id="${esc(l.id)}">
              <div><input data-f="label" type="text" value="${esc(label)}" /></div>
              <div><input data-f="um" type="text" value="${esc(l.um)}" /></div>
              <div><input data-f="saat" type="number" step="0.01" value="${esc(l.saat)}" /></div>
              <div><input data-f="adet" type="number" step="0.01" value="${esc(l.adet)}" /></div>
              <div><input data-f="birimSaatDzd" type="number" step="0.01" value="${esc(l.birimSaatDzd)}" /></div>
              <button class="xbtn" type="button" data-act="removeLine" data-art="${esc(art)}" data-ltype="l" data-id="${esc(l.id)}">×</button>
            </div>
            <div class="muted" style="margin:-2px 0 8px 0; font-size:11px;">
              Tutar: <b data-total="${esc(art)}|l|${esc(l.id)}">${fmt(total)} DZD</b> |
              maaş: <span>${fmt(l.maasDzd)} DZD</span>
            </div>
          `;
        }).join("");

        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = 6;

        td.innerHTML = `
          <div class="pozCard" data-poz="${esc(art)}">
            <div class="pozHeader">
              <span class="title">${esc(art)}</span>
              <span class="mini">${poz ? esc(poz.description) : "<span class='warn'>DQE’de yok</span>"} ${umWarn}</span>

              <div class="rightSide">
                <span class="badge">POZ: ${pozVal != null ? fmt(pozVal) : "-"} ${costState.pozCol==="euro" ? "€" : "DZD"}</span>
                <span class="badge">Birim maliyet: <b data-poz-unit="${esc(art)}">${fmt(t.unit)}</b> DZD/UM</span>
                <span class="badge">Toplam: <b data-poz-total="${esc(art)}">${fmt(t.total)}</b> DZD</span>
                <span class="badge">Fark: <b data-poz-diff="${esc(art)}">${(diff!=null)? (fmt(diff)+" ("+fmt(diffPct)+"%)") : "-"}</b></span>
              </div>
            </div>

            <div style="margin-top:10px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
              <div class="muted" style="font-size:12px;">Üretim (bu POZ için):</div>
              <input data-act="setProduction" data-art="${esc(art)}" type="number" step="0.01"
                     value="${esc(pconf.production)}"
                     style="padding:8px;border:1px solid #d1d5db;border-radius:10px; width:140px;" />
              <span class="muted" style="font-size:12px;">(ör: m³/gün). Birim maliyet = toplam / üretim</span>
              <button class="btn" type="button" data-act="removePoz" data-art="${esc(art)}">Bu POZ’u listeden çıkar</button>
            </div>

            <div class="grid2">
              <div class="box">
                <div class="boxTitle">MAKİNA</div>
                <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
                  <select data-act="addMachineSelect" data-art="${esc(art)}">
                    <option value="">Makina seç...</option>
                    ${machineOptions}
                  </select>
                  <button class="btn" type="button" data-act="addMachineBtn" data-art="${esc(art)}">Ekle</button>
                  <span class="badge">Subtotal: <b data-sub="${esc(art)}|m">${fmt(t.m)}</b> DZD</span>
                </div>

                <div class="rowHead">
                  <div>Cinsi</div><div>UM</div><div>Miktar</div><div>Adet</div><div>Birim Fiyat</div><div></div>
                </div>

                <div data-list="${esc(art)}|m">
                  ${machineRows || `<div class="muted" style="margin-top:8px;">Henüz makina eklemedin.</div>`}
                </div>
              </div>

              <div class="box">
                <div class="boxTitle">İŞÇİLİK</div>
                <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
                  <select data-act="addLaborSelect" data-art="${esc(art)}">
                    <option value="">İşçilik seç...</option>
                    ${laborOptions}
                  </select>
                  <button class="btn" type="button" data-act="addLaborBtn" data-art="${esc(art)}">Ekle</button>
                  <span class="badge">Subtotal: <b data-sub="${esc(art)}|l">${fmt(t.l)}</b> DZD</span>
                </div>

                <div class="rowHead">
                  <div>Grup - Pozisyon</div><div>UM</div><div>Saat</div><div>Adet</div><div>Birim Saat</div><div></div>
                </div>

                <div data-list="${esc(art)}|l">
                  ${laborRows || `<div class="muted" style="margin-top:8px;">Henüz işçilik eklemedin.</div>`}
                </div>
              </div>
            </div>
          </div>
        `;

        tr.appendChild(td);
        tbody.appendChild(tr);
      }

      countEl.textContent = `POZ: ${costState.pozList.length}`;
    }

    // -----------------------
    // Cost: live update (NO rerender on typing)
    // -----------------------
    function updatePozUI(art) {
      const t = pozTotals(art);

      const subM = document.querySelector(`[data-sub="${CSS.escape(art)}|m"]`);
      const subL = document.querySelector(`[data-sub="${CSS.escape(art)}|l"]`);
      const totalEl = document.querySelector(`[data-poz-total="${CSS.escape(art)}"]`);
      const unitEl = document.querySelector(`[data-poz-unit="${CSS.escape(art)}"]`);

      if (subM) subM.textContent = fmt(t.m);
      if (subL) subL.textContent = fmt(t.l);
      if (totalEl) totalEl.textContent = fmt(t.total);
      if (unitEl) unitEl.textContent = fmt(t.unit);

      // diff update
      const poz = dqeByArt.get(String(art).trim()) || null;
      const pozVal = poz ? (poz[costState.pozCol] ?? null) : null;

      const diffEl = document.querySelector(`[data-poz-diff="${CSS.escape(art)}"]`);
      if (diffEl) {
        if (costState.pozCol === "euro" || pozVal == null || Number(pozVal) === 0) {
          diffEl.textContent = "-";
        } else {
          const diff = Number(pozVal) - t.unit;
          const diffPct = (diff / Number(pozVal)) * 100;
          diffEl.textContent = `${fmt(diff)} (${fmt(diffPct)}%)`;
        }
      }

      // totals inside each line
      const p = ensurePoz(art);
      for (const m of p.machines) {
        const el = document.querySelector(`[data-total="${CSS.escape(art)}|m|${CSS.escape(m.id)}"]`);
        if (el) el.textContent = `${fmt(machineLineTotal(m))} DZD`;
      }
      for (const l of p.labor) {
        const el = document.querySelector(`[data-total="${CSS.escape(art)}|l|${CSS.escape(l.id)}"]`);
        if (el) el.textContent = `${fmt(laborLineTotal(l))} DZD`;
      }

      // global footer total
      let grandTotal = 0;
      for (const a of costState.pozList) grandTotal += pozTotals(a).total;
      gtDzd.textContent = `${fmt(grandTotal)} DZD`;
      grandChip.textContent = `POZ toplamları: ${fmt(grandTotal)} DZD`;
    }

    // -----------------------
    // Main render switch
    // -----------------------
    function render() {
      if (currentView === "dqe") {
        expandAllBtn.disabled = false;
        collapseAllBtn.disabled = false;
        sortArtEl.disabled = false;
        renderDQE();
      } else {
        renderCOST();
      }
    }

    // -----------------------
    // UI events
    // -----------------------
    clearBtn.addEventListener("click", () => {
      q.value = "";
      render();
      q.focus();
    });
    q.addEventListener("input", () => render());

    viewSel.addEventListener("change", () => {
      currentView = viewSel.value;
      render();
    });

    expandAllBtn.addEventListener("click", () => {
      for (const g of dqeGroups) g.collapsed = false;
      render();
    });

    collapseAllBtn.addEventListener("click", () => {
      for (const g of dqeGroups) g.collapsed = true;
      render();
    });

    sortArtEl.addEventListener("change", render);

    // DQE collapse click
    tbody.addEventListener("click", (e) => {
      if (currentView !== "dqe") return;
      const btn = e.target.closest("[data-gid]");
      if (!btn) return;
      if (q.value.trim()) return;

      const gid = btn.getAttribute("data-gid");
      const g = dqeGroups.find(x => x.id === gid);
      if (!g) return;
      g.collapsed = !g.collapsed;
      render();
    });

    // COST actions (buttons/selects) - delegated
    tbody.addEventListener("click", (e) => {
      if (currentView !== "cost") return;

      const btn = e.target.closest("[data-act]");
      if (!btn) return;

      const act = btn.getAttribute("data-act");

      if (act === "addPoz") {
        const input = document.getElementById("pozPick");
        const art = (input?.value || "").trim();
        addPoz(art);
        if (input) input.value = "";
        render(); // poz ekleme/çıkarma = rerender OK
      }

      if (act === "clearPoz") {
        clearPozList();
        render();
      }

      if (act === "removePoz") {
        const art = btn.getAttribute("data-art");
        removePoz(art);
        render();
      }

      if (act === "addMachineBtn") {
        const art = btn.getAttribute("data-art");
        const sel = document.querySelector(`select[data-act="addMachineSelect"][data-art="${CSS.escape(art)}"]`);
        const v = sel?.value;
        if (v !== "") {
          addMachineLine(art, v);
          if (sel) sel.value = "";
          render(); // satır ekleme = rerender OK
        }
      }

      if (act === "addLaborBtn") {
        const art = btn.getAttribute("data-art");
        const sel = document.querySelector(`select[data-act="addLaborSelect"][data-art="${CSS.escape(art)}"]`);
        const v = sel?.value;
        if (v !== "") {
          addLaborLine(art, v);
          if (sel) sel.value = "";
          render();
        }
      }

      if (act === "removeLine") {
        const art = btn.getAttribute("data-art");
        const ltype = btn.getAttribute("data-ltype"); // m or l
        const id = btn.getAttribute("data-id");
        removeLine(art, ltype, id);
        render();
      }
    });

    // COST input changes (NO rerender) - delegated
    tbody.addEventListener("input", (e) => {
      if (currentView !== "cost") return;

      const inp = e.target.closest("input");
      if (!inp) return;

      // global unit panel
      const act = inp.getAttribute("data-act");
      if (act === "setUnit") {
        const k = inp.getAttribute("data-k");
        costState.unitPanel[k] = Number(inp.value);
        saveCostState();
        // total km yazısı için rerender lazım ama focus kaçmasın diye KESMİYORUZ.
        // kullanıcı bırakınca (blur) rerender yapacağız.
        return;
      }

      // production per poz
      if (act === "setProduction") {
        const art = inp.getAttribute("data-art");
        const p = ensurePoz(art);
        p.production = Number(inp.value);
        saveCostState();
        updatePozUI(art);
        return;
      }

      // line edits
      const lineWrap = inp.closest(".rowLine");
      if (!lineWrap) return;

      const art = lineWrap.getAttribute("data-art");
      const type = lineWrap.getAttribute("data-type"); // m / l
      const id = lineWrap.getAttribute("data-id");
      const field = inp.getAttribute("data-f");
      const p = ensurePoz(art);

      if (type === "m") {
        const line = p.machines.find(x => x.id === id);
        if (!line) return;
        if (field === "name" || field === "um") line[field] = inp.value;
        else line[field] = Number(inp.value);
        saveCostState();
        updatePozUI(art);
      }

      if (type === "l") {
        const line = p.labor.find(x => x.id === id);
        if (!line) return;
        if (field === "label") {
          // label = "Grup - Pozisyon" tek input
          const txt = inp.value;
          const parts = txt.split("-").map(s=>s.trim());
          line.grup = parts[0] || line.grup;
          line.pozisyon = parts.slice(1).join(" - ") || line.pozisyon;
        } else if (field === "um") {
          line.um = inp.value;
        } else {
          line[field] = Number(inp.value);
        }
        saveCostState();
        updatePozUI(art);
      }
    });

    // blur: global unit panel değişince km satırını güncellemek için render
    tbody.addEventListener("blur", (e) => {
      if (currentView !== "cost") return;
      const inp = e.target.closest('input[data-act="setUnit"]');
      if (!inp) return;
      // artık yazmayı bitirdi -> rerender ile km satırı güncellensin, ama bu blur zaten fokus bırakmış olur
      render();
    }, true);

    // pozCol change
    tbody.addEventListener("change", (e) => {
      if (currentView !== "cost") return;
      const sel = e.target.closest('select[data-act="setPozCol"]');
      if (!sel) return;
      costState.pozCol = sel.value;
      saveCostState();
      render();
    });

    // first render
    render();
  </script>
</body>
</html>
