:root{--ink:#2d3a1f;--ink2:#54663c;--gold:#8a6410;--glassbg:rgba(255,253,247,.62);--glassbrd:rgba(255,255,255,.75);
--shadow:0 14px 34px -14px rgba(24,40,12,.45),inset 0 1px 0 rgba(255,255,255,.9)}
html,body{margin:0;height:100%;overflow:hidden;background:#bfe0f2;font-family:"Baloo 2",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;color:var(--ink)}
#c{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
#vig{position:fixed;inset:0;pointer-events:none;z-index:5;background:radial-gradient(120% 100% at 50% 38%,transparent 55%,rgba(30,45,20,.16) 88%,rgba(24,38,16,.34) 100%)}
.glass{background:var(--glassbg);-webkit-backdrop-filter:blur(18px) saturate(1.45);backdrop-filter:blur(18px) saturate(1.45);border:1px solid var(--glassbrd);box-shadow:var(--shadow)}
.hud{position:fixed;left:16px;top:14px;z-index:10;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.title{border-radius:16px;padding:8px 16px 7px;font-weight:800;color:#2f5f28;font-size:17px;letter-spacing:.3px;line-height:1.05}
.title small{display:block;font-size:9.5px;color:#618141;font-weight:700;letter-spacing:1.6px}
.chip{border-radius:999px;padding:6px 14px 5px;font-size:13.5px;font-weight:700;color:var(--ink2)}
.chip b{color:#2f5f28}
.topright{position:fixed;right:16px;top:14px;z-index:10;display:flex;gap:8px;align-items:center}
.coinspod{border-radius:999px;padding:8px 16px 7px 12px;font-size:19px;font-weight:800;color:var(--gold);background:linear-gradient(180deg,rgba(255,247,222,.94),rgba(255,235,186,.88));border:1px solid #f0d492;box-shadow:0 10px 24px -10px rgba(40,28,8,.4),inset 0 1px 0 rgba(255,255,255,.8);display:flex;align-items:center;gap:7px}
.delpod{border-radius:999px;padding:8px 14px 7px;font-size:15px;font-weight:800;color:#2f5f28;display:flex;align-items:center;gap:6px}
.mute{border-radius:14px;padding:8px 11px;font-size:15px;cursor:pointer;font-family:inherit;border:1px solid var(--glassbrd)}
.hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:10;white-space:nowrap;background:rgba(22,42,16,.6);color:#fff;padding:8px 18px 7px;border-radius:999px;font-size:12.5px;font-weight:600;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.hint b{color:#bff09a}
#toasts{position:fixed;left:50%;top:56px;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{border-radius:999px;padding:7px 18px 6px;font-size:13.5px;font-weight:800;color:var(--ink);animation:tst 2.9s ease forwards;display:flex;align-items:center;gap:6px}
.toast.gold{color:var(--gold)}
@keyframes tst{0%{opacity:0;transform:translateY(-10px) scale(.9)}12%{opacity:1;transform:none}82%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
@media (max-width:760px){.hint{font-size:10px;white-space:normal;max-width:94vw;text-align:center}}
</style>
