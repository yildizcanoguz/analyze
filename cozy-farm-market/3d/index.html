<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Küçük Pazar — 3B Köy (WebGL)</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#bfe0f2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  #c{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  .hud{position:fixed;left:18px;top:16px;z-index:10;display:flex;align-items:center;gap:12px;
    background:rgba(255,255,255,.52);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);
    border:1px solid rgba(255,255,255,.7);border-radius:18px;padding:11px 18px;
    box-shadow:0 14px 32px -12px rgba(20,40,10,.45),inset 0 1px 0 rgba(255,255,255,.85)}
  .hud .logo{font-size:30px;filter:drop-shadow(0 2px 2px rgba(30,50,15,.2))}
  .hud h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.3px;color:#2f5f28;line-height:1}
  .hud .sub{font-size:11px;color:#436a2c;font-weight:700;letter-spacing:.3px;margin-top:2px}
  .tag{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:10;white-space:nowrap;
    background:rgba(22,42,16,.58);color:#fff;padding:8px 17px;border-radius:999px;font-size:12.5px;font-weight:700;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 8px 20px -6px rgba(0,0,0,.4)}
  @media (max-width:560px){.tag{font-size:10.5px;white-space:normal;max-width:90vw;text-align:center}.hud h1{font-size:18px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><div class="logo">🌾</div><div><h1>Küçük Pazar</h1><div class="sub">3B KÖY · GERÇEK ZAMANLI WEBGL</div></div></div>
<div class="tag">Gerçek 3B · yumuşak gölgeler · PBR malzeme · yürüyen köylüler · dönen sinematik kamera</div>
<script src="three.min.js"></script>
<script src="scene.js"></script>
</body>
</html>
