<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
<title>OVERSTRIKE</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #000; color: #e8eaed;
    font-family: "Rajdhani", "Bahnschrift", "DIN Alternate", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none; cursor: default;
  }
  #app { position: fixed; inset: 0; }
  canvas#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #ui-root { position: absolute; inset: 0; pointer-events: none; }
  #boot {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: #06080a; z-index: 100; transition: opacity .6s ease;
  }
  #boot.hidden { opacity: 0; pointer-events: none; }
  #boot .title {
    font-size: 44px; letter-spacing: .38em; font-weight: 700;
    text-indent: .38em; color: #f2f4f6;
  }
  #boot .bar { width: 320px; height: 2px; background: #1b2026; overflow: hidden; }
  #boot .bar i { display: block; height: 100%; width: 0%; background: #d8ab4a; transition: width .25s ease; }
  #boot .status { font-size: 12px; letter-spacing: .22em; color: #6b7580; text-transform: uppercase; }
  #crash {
    position: absolute; inset: 0; display: none; z-index: 200; padding: 40px;
    background: #0a0000; color: #ff8f7a; font-family: ui-monospace, monospace;
    font-size: 13px; white-space: pre-wrap; overflow: auto;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/webgpu": "./vendor/three.webgpu.js",
    "three/tsl": "./vendor/three.tsl.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
</head>
<body>
<div id="app">
  <canvas id="view"></canvas>
  <div id="ui-root"></div>
  <div id="boot">
    <div class="title">OVERSTRIKE</div>
    <div class="bar"><i id="boot-bar"></i></div>
    <div class="status" id="boot-status">initializing</div>
  </div>
  <pre id="crash"></pre>
</div>
<script type="module">
  window.addEventListener('error', e => {
    const el = document.getElementById('crash');
    el.style.display = 'block';
    el.textContent += `\n[error] ${e.message}\n  at ${e.filename}:${e.lineno}:${e.colno}\n${e.error?.stack || ''}\n`;
    window.__crashed = true;
  });
  window.addEventListener('unhandledrejection', e => {
    const el = document.getElementById('crash');
    el.style.display = 'block';
    el.textContent += `\n[unhandled] ${e.reason?.message || e.reason}\n${e.reason?.stack || ''}\n`;
    window.__crashed = true;
  });
  import('./src/main.js').catch(err => {
    const el = document.getElementById('crash');
    el.style.display = 'block';
    el.textContent += `\n[boot failure] ${err.message}\n${err.stack}\n`;
    window.__crashed = true;
  });
</script>
</body>
</html>
